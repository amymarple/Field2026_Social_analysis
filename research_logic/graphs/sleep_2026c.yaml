    0.49 analytic / 0.27 simulated vs the round slope 0.34) → dawn timing not excluded; G2 no handling-specific REM-entry
    shortfall against matched natural long wakes (≤ 3 animals); G3 the REM expected during the unrecorded gap does not
    absorb the pass2med slope (fall 3 % / 2 %), while on FINAL (no pre-round slope) the gap's expected REM itself predicts
    more REM after the round (+0.15 per min) — the scorings disagree on what is repaid; G4 a larger slope where the
