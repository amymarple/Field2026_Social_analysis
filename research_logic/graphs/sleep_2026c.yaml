    - change_log/2026-10-09-rem-ripple-model.md
    - implementation_plan/2026-10-09-rem-ripple-model.md
    - results/2026c/ephys_spikes/reports/ephys_spikes_sleep_schedule_claim_audit_2026c.md
    - results/2026c/ephys_spikes/reports/ephys_spikes_swr_rem_macro_2026c.md
    - results/2026c/ephys_spikes/reports/ephys_spikes_swr_rem_naps_2026c.md
  answers:
    aim: >-
      Test whether NREM sharp-wave ripples carry REM-entry information beyond the count P (Step B's B-full at
      P_tw600_k0), the clock and the wake history, held out on both scorings — i.e. whether the macro 'ripple-rich naps
      / REM-poor nights' reciprocity is a link or shared drivers. Pre-registered with the model's owner; the artifact
      checks (Amendment 2) and the follow-up after a read-only Fable audit (Amendment 3) were each written before they
      ran.
    answered: >-
      At the scale of the REM cycle ripples add no REM-entry information beyond the count, the clock and the wake history
      (#54, Established, bounded at ~0.05 %): the recent 10-min ripple rate adds nothing at lags 0–120 s, and ripples
      older than the last minute add nothing, also where the lag can see (K7). The ripple counter's small held-out gain
      (−0.33 % / −0.30 %) is the ripple poverty of short NREM bouts that end in REM — 40 % of REM entries, often between
      REM bouts of one episode — confined to the first one to two minutes of NREM bouts (#55, Established as a
      description). The Amendment-2 reading (a transition-local drop: ripples vanish as REM begins) is withdrawn and kept
      only as superseded history (r.rip_a2). The depth control is inconclusive: the scorings disagree.
    supported_weakened: >-
      Weakened (established, bounded): a ripple → REM-readiness link at the REM-cycle scale. Supported (established,
      predictive, REM-cycle scale): shared drivers — once the count, the clock and the wake history are in, ripples add
      nothing about REM entry; that this accounts for the macro reciprocity is the report's reading, not an audited
      claim. Weakened: the precursor reading of the counter's gain (a pre-REM drop within longer bouts). The count model
      survives a ripple rival (j.model.r6 refined). Depth: neither way.
    indistinguishable: >-
      Whether the ripple-poor short REM-ending NREM bouts are the scorer's cuts inside REM episodes or genuinely
      ripple-poor brief NREM (scorer and detector read the same LFP); whether NREM depth carries the counter's gain
      (K4b: FINAL beyond depth holds, pass2med does not); whether the REM drive that the count tracks also lowers ripples
      (a link a predictive test beyond the count cannot see) vs ripples and REM sharing only the clock and depth; a ripple
      contribution that moves with the daily clock and is absorbed by it; sleep-onset NREM after long wakes (outside the
      subset); and whether a last-minute ripple dip exists within long bouts and carries held-out information — naps R3
      is a pooled within-run description, a different quantity from K8's whole-bout rates (c.pre_rem_drop resolved by
      the Fable review r7), and no held-out test of a last-minute term exists.
    next: >-
      Top for this branch (LFP stage): n.rip_short_bouts — read the short REM-ending NREM bouts blind with independent
      state measures. If they read as REM or intermediate sleep, #55 is the scorer's cut: the ripple branch reduces to
      #54's bounded null (j.ripples.r7) and #3's first-minute REM peak reads as REM fragmentation (j.drive.r4). If they
      are genuine NREM and stay ripple-poor, ripple-poor brief NREM between REM bouts becomes a candidate physiological
      feature of REM episodes (j.ripples.r7). If the reads disagree, it stays open and manual κ comes first. n.depth_lfp
      (already priority 12 for #4) now also settles K4b: depth absorbing the gain on both scorings → h.rip.depth;
      surviving → beyond depth (j.ripples.r7). Then n.rip_last_minute (Fable review r7): no per-bout dip → R3 was
      diluted noise, #54 / #55 unchanged; a dip with a held-out null → a description without predictive value; a
      held-out gain on both scorings → a new candidate, transition-local information within long bouts, still not
      readiness (j.ripples.r7). n.rip_rate_vs_count separates a REM-drive → ripple link from shared drivers in the
      narrow sense (j.ripples.r7).
  next_steps: [n.rip_short_bouts, n.depth_lfp, n.rip_last_minute, n.rip_rate_vs_count]
  reviews:
    - by: "Fable (read-only audit of the ripple-model run, before Amendment 3)"
      summary: >-
        No leakage and no material bug. The Amendment-2 lag check is uninformative where the gain sits (steps < 60 s
        into a bout carry 70–80 % of it); 40 % of REM entries come from ripple-poor NREM bouts ≤ 60 s, plausibly the
        scorer's labels inside REM episodes; the depth check lost 35 % of REM entries with no same-subset baseline.
        Amendment 3 (K7, K4b, K8) was written before running.
    - by: "claim audit (/scientific-report-promotion), 2026-10-09"
      summary: >-
        #54 Established (scoped, bounded negative, both scorings) and #55 Established (description), both → next stage
        (LFP); 'ripples vanish as REM begins' withdrawn; 'not beyond NREM depth' forbidden (K4b inconclusive).
    - by: "this map (r7, housekeeping)"
      summary: >-
        28 citations that had drifted (the explore plan grew by 7 lines with its Amendment 1; the claim audit grew with
        #44–#55) were re-pointed, content unchanged, each recorded in its node's changes. Rounds for parts S, G, F2 and
        F1 (#44–#53) are not yet in this map.
    - by: "Fable r7 (read-only review of round r7)"
      summary: >-
        All r7 statuses consistent with claim audit #54 / #55; nothing upgraded or widened; c.pre_rem_drop resolved
        (different quantities). Applied here: r.swr_r3 gains its n, method and the review's allowed / forbidden wording
        (status stays ledger); 'whole-bout' added to #55's long-bout statement in r.s55 (text and allowed wording; the
        audit row carries the same word since commit a7e4796) and j.ripples.r7; r.s55 added to j.model.r6's basis; new proposed
        h.rip.last_minute and next step n.rip_last_minute (priority 18; n.rip_rate_vs_count → 19).

- id: r8
  date: 2026-10-09
  label: "Sleep behaviour explore, Amendment 1: sleep stability and the battery rounds as a perturbation (S), the origin of #43 (G), the step-F batches (F1 sequence-only, F2 WISER / environment / social)"
  inputs:
    - results/2026c/ephys_spikes/reports/ephys_spikes_sleep_explore_S_2026c.md
    - results/2026c/ephys_spikes/reports/ephys_spikes_sleep_explore_G_2026c.md
    - results/2026c/ephys_spikes/reports/ephys_spikes_sleep_explore_F2_2026c.md
    - results/2026c/ephys_spikes/reports/ephys_spikes_sleep_explore_F1_2026c.md
    - results/2026c/ephys_spikes/reports/ephys_spikes_sleep_schedule_claim_audit_2026c.md
    - implementation_plan/2026-10-08-sleep-behaviour-explore.md
  answers:
    aim: >-
      The user's question: can the count model predict sleep stability — which movements end in waking, and how sleep
      responds to the battery rounds, a systematic perturbation a true model should predict? Plus the origin of the
      post-round REM repayment (#43) and the step-F hypotheses on REM maintenance, the night ramp, a daily quota, the
      cycle structure, wake activity, housemates, warmth and rain — all with rules written before results.
    answered: >-
      The rules, never shown a round, predict the REM and NREM amounts over 3–6 h after it (#47) but not its stability:
      for about an hour NREM ends in waking ~1.3–1.45× as often as predicted, in all six rats, and not after natural long
      wakes (#44); the first REM comes later in wall time (#47). The count does not help rank which movements wake (#45);
      movers wake ~20 % more than predicted (#46, scorer circularity). #43 stays Candidate (power): dawn timing not
      excluded (G1), no handling-specific REM-entry shortfall (G2, ≤ 3 animals), the gap's REM loss does not absorb the
      pass2med slope while FINAL repays the gap's expected REM (G3), no consistent gate release (G4). F1: the same count
      predicts the next REM bout's duration (#48); MAs are most frequent right after a REM (#51); no daily REM quota in
      the transitions (#52); no within-episode shortening of inter-REM intervals (#53); night REM ends in waking more
      often (#49) and quick returns are rarer at night (#50), both Candidate. F2: nothing held on both scorings.
    supported_weakened: >-
      Supported: an acute post-round arousal the rules lack (established); the count goes with REM duration
      (established association); REM exits shift at night (candidate); role beyond the model (candidate). Weakened: the
      rules as a predictor of the round response (stability, timing); 'only REM entry is regulated' as stated (its
      maintenance half; conflict c.entry_only_wording, resolved 2026-10-10 by the audit owner's rewrite); the count as
      the history that gates who wakes (population level);
      pre-REM microarousals; ultradian progression; a daily REM quota; warmth via maintenance; a housemate's departure
      waking the partner.
    indistinguishable: >-
      What causes the post-round arousal (handling vs the release context); why the first REM comes later (part S read
      it as the extra waking — tested in r9); the origin of #43 (handling vs dawn timing vs the round's sleep loss vs a
      general REM deficit); the night ramp as wake length vs time of night (H5 FINAL only); step vs discount for 2–7-min
      wakes (H23 underpowered); wake activity vs the night for post-wake NREM (H4, path ≈ wake length); a new sleep site
      (H17) and rain (H22) — underpowered; quick returns rarer at night vs the shared REM-after-wake scorer rule (#50).
    next: >-
      Model the post-round response as dynamics before any REM-need rule (Amendment 2, part P): a decaying arousal fitted
      on waking only, cross-fitted and frozen, allowed to fail. If it restores the first-hour waking AND the simulated
      first REM, the delay is the arousal and no REM variable is needed (j.perturbation.r8 → r9); if the waking is
      restored but the delay stays, a REM-side (or other) process remains; a REM residual outside the simulated range in
      the same direction on both scorings would trigger part Q (j.compensation.r6). The within-event history test
      (n.within_event_history) stays open behind it.
  next_steps: [n.within_event_history]
  reviews:
    - by: "claim audit (/scientific-report-promotion), 2026-10-09"
      summary: "#44 and #45, #47 Established; #46 Candidate (measurement circularity); #43 stays Candidate after part G (power); F2 listed without numbers (none held on both scorings); #48, #51–#53 Established, #49 and #50 Candidate; notes on #6b (H5), #14 (H7 at the same count), #34 (H23)."
    - by: "this map (r8, housekeeping)"
      summary: >-
        44 citations that had drifted (the explore plan's status block grew by 13 lines; the claim audit by 42 lines
        with #56–#64) were re-pointed, content unchanged, each recorded in its node's changes. Step E's '27/28 checks'
        corrected in n.step_e's r6 entry and in round r6's answers to '27 of 28 in total (13/14 FINAL, 14/14 pass2med)'
        (the user, 2026-10-10; r.s40 and j.model.r6 already read so since r7). New branch q.perturbation (the battery
        rounds as a perturbation). This round was entered on 2026-10-10 together with r9 and r10, from the final audit
        rows; the round's state before part P is kept in j.perturbation.r8 (superseded).

- id: r9
  date: 2026-10-10
  label: "Sleep behaviour explore, Amendments 2–6: perturbation dynamics after the battery rounds (P arousal, T two-phase, L where the delay is, H the house-entry clock) and the long-wake memory term (W); the behaviour stage closes"
  inputs:
    - results/2026c/ephys_spikes/reports/ephys_spikes_sleep_explore_P_2026c.md
    - results/2026c/ephys_spikes/reports/ephys_spikes_sleep_explore_T_2026c.md
    - results/2026c/ephys_spikes/reports/ephys_spikes_sleep_explore_L_2026c.md
    - results/2026c/ephys_spikes/reports/ephys_spikes_sleep_explore_L_startawake_2026c.md
    - results/2026c/ephys_spikes/reports/ephys_spikes_sleep_explore_H_2026c.md
    - results/2026c/ephys_spikes/reports/ephys_spikes_sleep_explore_W_2026c.md
    - results/2026c/ephys_spikes/reports/ephys_spikes_sleep_schedule_claim_audit_2026c.md
    - implementation_plan/2026-10-08-sleep-behaviour-explore.md
  answers:
    aim: >-
      Model the post-round response as dynamics fitted on other data and frozen (P: a decaying arousal; T: a delayed calm
      phase), find where the later first REM sits (L: onset wait vs after onset vs the first entry; H: a clock at the
      rat's own house entry, and what the opening NREM is), and test one last behaviour-level term, a memory of the last
      long wake, against the evening delay and the night ramp (W).
    answered: >-
      A single arousal (odds ×1.7, decaying over 20–40 min, fitted on waking only) restores the first-hour waking held out
      (#56, candidate; log-loss gain on pass2med only) but not the later first REM (#57, established). A calm phase of the
      tested two-phase form adds nothing held out (#58, scoped to that form), though with the house-entry clock waking is
      below the model 1–3 h after entry on both scorings (#63). A post-round recording starts at the release into the
      paddock (#59, the field operator's correction); half open with ~2 min scored NREM while the rat lies motionless in
      the field (#62); waking is highest in the field before the house entry (#63); the delay sits mostly in those records,
      the first REM entry is not specially mispredicted (#61), and from the first NREM in the house the morning first REM
      is reproduced — the morning delay is the field period; 'REM-side' is withdrawn. After evening rounds the first REM
      needs more NREM than predicted (#60: pass2med strong, FINAL at the edge). A long-wake memory adds nothing (#64).
      FINAL's extra morning REM is base-dependent; pass2med's debt slope is the only robust REM residual (#43); part Q
      not run.
    supported_weakened: >-
      Supported: the arousal as one decaying term (candidate); a calm phase after the house entry (established,
      descriptive); the morning delay as the field period (established); an evening NREM-clock delay on fixed thresholds
      (candidate). Weakened: the waking as the explanation of the REM delay (established); a REM-side suppression
      (morning and the first entry, established; the evening stays open); the tested two-phase term (established,
      scoped); a general long-wake memory (established); the opening NREM as a scorer-edge artefact (established).
    indistinguishable: >-
      Whether the opening field NREM is sleep or awake immobility (#62's scorer-validity risk — if immobility, the
      first-hour numbers of #44 / #56 / #63 carry it); handling vs the release context as the arousal's cause (H2: the
      release vs entry clock unresolved); the evening delay as pre-transition depth vs a theta scoring lag vs a REM-side
      process; the night ramp as wake length vs time of night (#64 has its direction, no gain); the origin of #43.
    next: >-
      The Fable plateau audit: GO to the LFP stage (r10). The residuals left (#60, #62, #43) need LFP or video. First:
      the depth feature on a non-scorer site and L1, P vs depth vs P + depth; for this branch L2(c) (opening NREM: ≥ 70 %
      NREM-like → sleep; else a scorer-validity ledger item for #44 / #56 / #63) — on hold for the user's video labels —
      then L2(a) (#60 vs depth) and L2(b) (#60 vs a theta scoring lag), each changing j.perturbation.r9.
  next_steps: [n.lfp_l2c, n.lfp_l2a, n.lfp_l2b]
  reviews:
    - by: "claim audit (/scientific-report-promotion), 2026-10-09 / 2026-10-10"
      summary: "#56 Candidate (strong), #57 Established (the 'REM-side' clause withdrawn after L), #58 Established (scoped negative, the tested form), #59 Established (record start = release into the paddock, corrected by the field operator 2026-10-10), #60 Candidate (narrowed after the plateau audit: pass2med strong, FINAL at the edge), #61–#63 Established (#62 with the scorer-validity risk), #64 Established; #43, #44, #47 updated."
    - by: "this map (r9)"
      summary: "Corrections from the user applied: #59 (release, not before placement), #57 ('the delay is REM-side' withdrawn; resolved conflict c.rem_side records the S / P report sentences, annotated by the main session 2026-10-10), #60 (Candidate, pass2med strong / FINAL at the edge), #58 (scoped to the tested two-phase form). New bases b.release_clock and b.perturb_blind; #44, #56, #61, #63 depend on #62."

