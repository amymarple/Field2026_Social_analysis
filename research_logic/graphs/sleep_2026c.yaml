  short: shorter REM
  title: "At night REM bouts are shorter (maintenance-limited)"
  text: >-
    Raw night vs day REM-bout duration: 71 vs 74 s, a precise null (#14). At the same count at REM onset (F1 H7, r8) night
    bouts are 19 % shorter on pass2med but not on FINAL: the night carries more NREM into each REM, which lengthens REM
    (#48), and may hide a night shortening at the same count. #14 now forbids 'at the same count, night REM bouts last as
    long as day bouts'.
