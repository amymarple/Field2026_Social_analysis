  changes:
    - {round: r4, what: "open → mixed: weakened as a pause across wakes (#34); the continuous-sleep tie (#7) stays unresolved."}
  round_added: r1

- id: h.carry.clock_wall
  type: hypothesis
  branch: q.carryover
  short: wall clock
  title: "The REM counter runs on elapsed time (keeps running during wake)"
  text: >-
    A count that keeps running in wake predicts sooner REM after a longer wake; the data show later REM (#6a/#6b): at
    REM entry a wake does not count as NREM time (claim audit #7, added 2026-10-08). A separate wall-clock term on top
    of the NREM count does add (#36) — a different hypothesis (h.carry.wall_term).
  level: pattern
  status: mixed
  src:
