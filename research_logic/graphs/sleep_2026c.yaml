    The audit owner rewrote the synthesis's organising idea (2026-10-10): 'only REM entry is regulated' is marked
    superseded by #48 / #49, as the plan anticipated (n.f_rem_maintenance outcome 2). It now reads: the count since the
    last REM sets when REM starts and also predicts how long the next REM lasts (#48), read through a smooth daily curve
    (#35); at night REM more often ends in waking (#49, Candidate); a REM-repayment process only after handled
    interruptions and only on fixed thresholds (#43); 'regular inputs, no budget' shown only conditional on the observed
    long wakes (#40), the unconditional test being the long-wake generative model. The map keeps h.core.entry_only with
    its history, weakened for the REM-maintenance half (j.core.r8); the REM-entry half is h.model.count and the
    'regular inputs' half is h.core.regular_inputs (n.longwake_generative). Sides quote the sources as they read when the
    conflict was opened.
  resolved_by: "main session (audit owner), 2026-10-10: synthesis organising idea rewritten after #48 / #49"
  sides:
    - {node: h.core.entry_only, says: "Claim audit synthesis (unchanged 2026-10-10): 'Organising idea (interpretation). Only REM entry is regulated, by this count and a smooth daily curve (#35); a separate REM-repayment process appears only after handled interruptions (#43).' The hypothesis as entered (r2) adds 'REM duration and REM exits follow no history'."}
    - {node: r.s48, says: "#48 Established (both scorings, 6/6): 'the same count that sets when REM starts also predicts how long it lasts' (+24 % / +26 % per unit of ln(1 + P)); #49 Candidate: night REM bouts end in waking more often at matched length (FINAL strong). The pre-written outcome of n.f_rem_maintenance: a named predictor for duration or exits → 'the organising idea is rewritten'."}
