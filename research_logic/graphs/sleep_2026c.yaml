    - results/2026c/ephys_spikes/reports/ephys_spikes_mic_wake_pilot_2026c.md
    - results/2026c/ephys_spikes/reports/ephys_spikes_sleep_quant_2026c.md
    - implementation_plan/2026-10-07-sleep-internal-schedule.md
  answers:
    aim: >-
      Lay out the whole sleep analysis so far as one logic: does sleep keep an internal history and reorganise
      NREM/REM after disturbance, and prepare the link to who keeps sleeping vs wakes in a shared event.
    answered: >-
      History shapes how NREM ends, is summarised by a few running quantities since the last REM, and survives brief
      wakes (all established). The night limits REM entry, not REM maintenance (established). REM coupling between
      housemates beyond shared timing was rejected, while fast movement coupling is strong and partly active.
    supported_weakened: >-
      Supported: internal rules that carry history; carry-over across brief wakes; entry-limited night REM; fast,
      partly active movement coupling. Weakened: the no-history null; a within-cycle stage trade-off (the PI's first
      formulation); store-and-resume after long wakes; REM payback within continuous sleep; housemate REM coupling.
      Corrected by the reviews: handling stress, the REM budget and arousal contagion went back to open.
    indistinguishable: >-
      Update vs a selection effect vs post-wake fragility for the long-wake delay (#6); NREM vs wall clock; a lower REM
      drive vs arousal-prone periods; payback vs timing shift; handling itself vs the round's long daytime wake; the
      night itself vs the long wake before naps; propagation vs a common trigger; contagion vs a shared drift to lighter
      sleep; day weather vs the day-order trend; and, for the new link, own history vs role/state vs animal trait, and
      event-specific vulnerability vs a general tendency to wake.
    next: >-
      Priority 1: the within-event history test on the Phase-6 library (n.within_event_history): first count the events
      where some participants wake and others do not; main model on pre-event state, history and animal (role only as
      a secondary analysis); then history × event against matched no-event moments. If history predicts waking more
      during events, the carried history also sets resilience to disturbance (core judgment extended); if equally
      without events, it sets a general tendency to wake; if only the animal predicts, who wakes is individual (not
      evidence that history plays no role); if only in NREM, NREM depth at the event (LFP) is next. Priority 2: the
      hazard test for the long-wake delay (#6), which separates update, selection and post-wake fragility.
  next_steps: [n.within_event_history, n.survival_long_wake]
  reviews:
    - by: "Fable (adjudication of conflicts and statuses)"
      summary: >-
        c.rem_length and c.delay_vs_minutes are different quantities, not contradictions (resolved with their
        reasoning); c.windows premise corrected (v2 windows sat on the clock baseline M0); status corrections:
        handling stress and the REM budget back to open, wake-since-REM split from state persistence, propagation text
        moved off fast coupling, #28c kept a Candidate, no-join basis added; n.survival_long_wake extended (both
        hazards, both clocks, first-hour REM) and its forbidden 'reset' outcome wording removed.
    - by: "astra (Codex session, logic flow)"
      summary: >-
        Main line coherent; the within-event test is the right first step. Bands test shares, not order (open conflict
        c.sequence_wording); 'lasted about one cycle' rests on an underpowered null (open conflict c.one_cycle); 'still
        partner' is defined after the event, so #29d cannot settle contagion (c.partner_waking reopened); role is a
        post-event response, so it moves to a secondary analysis, and a history × event comparison with matched
        no-event moments was added.

- id: r2
  date: 2026-10-08
  label: "Logic audit of Phases 0–6 (Fable) with the main session's checks; claim-audit update; plan of the sleep behaviour explore"
  inputs:
    - docs/methods/sleep_logic_audit_2026-10-08.md
    - results/2026c/ephys_spikes/reports/ephys_spikes_sleep_schedule_claim_audit_2026c.md
    - implementation_plan/2026-10-08-sleep-behaviour-explore.md
  answers:
    aim: >-
      Re-check the whole Phase 0–6 chain as one logic, decide which claims change status, and set what the next stage
      (sequence + IMU + WISER + temperature + handling only; LFP features later) must test.
    answered: >-
      The night → next-day 'trade-off' is a cohort-wide drift of sleep from night into day (#30 established; #13
      withdrawn as a balance, #24 superseded). #6 splits into 'not resumed' after wakes ≥ 7 min, by day and night (#6a)
      and 'graded with wake length only at night' (#6b). At matched short prior wakes the night still lowers REM entry
      (#14b, candidate). Sleep after a wake is NREM-dense mostly because of the night (#31, candidate): the proposed
      NREM rebound ∝ wake length was not adopted. #4, #16, #29c moved to the LFP stage; scorer-gate caveat on #28b / #29a.
    supported_weakened: >-
      Supported: a cohort drift from night to day; the night itself (not the prior wake) lowering REM entry
      (candidate). Weakened: a day-to-day 24-h balance; store-and-resume after long wakes; the prior wake as the
      explanation of the night effect; post-wake fragility and survivor selection as the whole long-wake delay.
      New, to test: only REM entry is regulated; reset vs discount vs pause; light step vs smooth curve; NREM homeostat
      vs the night; a slow REM deficit vs the count seen through the gate; counter vs momentum.
    indistinguishable: >-
      A step at ~7 min vs an exponential discount (2–7-min wakes untested); 'long wake' vs 'night' above 30 min; the
      NREM excess as a homeostat vs the night baseline; the morning payback as a REM deficit vs the count through the
      gate vs dawn timing vs handling; light vs circadian curve; the drift as adaptation vs weather vs activity.
    next: >-
      Step A, the reproduction gate in repo code, before any status rises: if A1 passes, #6a becomes established (not
      resumed); if A3 passes, #14b; if A4 holds day-demeaned on fixed thresholds, #10 stays candidate (strong) pending
      step D; if A5 loses half the mover excess, 'movement raises waking' is withdrawn as definitional (j.social). Then
      Step B, the one-count model, which settles reset vs discount as τ_w (j.carryover) or leaves it open.
  next_steps: [n.step_a, n.step_b]
  reviews:
    - by: "Fable logic audit (read-only), with the main session's checks overriding it where they differ"
      summary: >-
        The chain is right at the start (a count since the last REM) and the end (regulation acts on REM entry); the
        middle was stitched: #13 is a drift, #6 is two findings, the matched night gain and the REM-specific morning
        payback hold on Fable's checks. Its proposed 'NREM rebound ∝ wake length' (Established) was not adopted by the
        main session (c.nrem_rebound, resolved).
    - by: "claim audit (/scientific-report-promotion), 2026-10-08 update"
      summary: "#6 → #6a / #6b; #10 re-worded; #13 withdrawn as a balance → #30; #24 superseded; #14b and #31 added; scorer-gate caveat on #28b / #29a; #4, #16, #29c to the LFP stage."

