- id: h.rip.scorer_cut
  type: hypothesis
  branch: q.ripples
  short: scorer's REM cuts
  title: "Scorer's cut: the ripple poverty of short REM-ending NREM bouts reflects how the scorer cuts REM episodes into REM and brief NREM labels"
  text: >-
    Named by the Fable audit (plan Amendment 3) and kept in #55: the scorer's NREM / REM call and the ripple detector
    read the same LFP, so brief 'NREM' labels inside a REM episode can be ripple-poor because their LFP is REM-like,
    not because the rat was in a different kind of NREM.
  level: pattern
  status: open
  src:
