    - implementation_plan/2026-10-07-sleep-internal-schedule.md
  answers:
    aim: >-
      Lay out the whole sleep analysis so far as one logic: does sleep keep an internal history and reorganise
      NREM/REM after disturbance, and prepare the link to who keeps sleeping vs wakes in a shared event.
    answered: >-
      History shapes how NREM ends, is summarised by a few running quantities since the last REM, and survives brief
      wakes (all established). The night limits REM entry, not REM maintenance (established). REM coupling between
      housemates beyond shared timing was rejected, while fast movement coupling is strong and partly active.
    supported_weakened: >-
      Supported: internal rules that carry history; carry-over across brief wakes; entry-limited night REM; fast,
      partly active movement coupling. Weakened: the no-history null; a within-cycle stage trade-off (the PI's first
      formulation); store-and-resume after long wakes; REM payback within continuous sleep; housemate REM coupling.
      Corrected by the reviews: handling stress, the REM budget and arousal contagion went back to open.
    indistinguishable: >-
      Update vs a selection effect vs post-wake fragility for the long-wake delay (#6); NREM vs wall clock; a lower REM
      drive vs arousal-prone periods; payback vs timing shift; handling itself vs the round's long daytime wake; the
      night itself vs the long wake before naps; propagation vs a common trigger; contagion vs a shared drift to lighter
      sleep; day weather vs the day-order trend; and, for the new link, own history vs role/state vs animal trait, and
      event-specific vulnerability vs a general tendency to wake.
    next: >-
      Priority 1: the within-event history test on the Phase-6 library (n.within_event_history): first count the events
      where some participants wake and others do not; main model on pre-event state, history and animal (role only as
      a secondary analysis); then history × event against matched no-event moments. If history predicts waking more
      during events, the carried history also sets resilience to disturbance (core judgment extended); if equally
      without events, it sets a general tendency to wake; if only the animal predicts, who wakes is individual (not
      evidence that history plays no role); if only in NREM, NREM depth at the event (LFP) is next. Priority 2: the
      hazard test for the long-wake delay (#6), which separates update, selection and post-wake fragility.
  next_steps: [n.within_event_history, n.survival_long_wake]
  reviews:
    - by: "Fable (adjudication of conflicts and statuses)"
      summary: >-
        c.rem_length and c.delay_vs_minutes are different quantities, not contradictions (resolved with their
        reasoning); c.windows premise corrected (v2 windows sat on the clock baseline M0); status corrections:
        handling stress and the REM budget back to open, wake-since-REM split from state persistence, propagation text
        moved off fast coupling, #28c kept a Candidate, no-join basis added; n.survival_long_wake extended (both
        hazards, both clocks, first-hour REM) and its forbidden 'reset' outcome wording removed.
    - by: "astra (Codex session, logic flow)"
