  text: >-
    Established: rules never shown a round predict the REM and NREM amounts over 3–6 h after it (#47), but not its
    stability or timing. A post-round recording starts at the rat's release into the paddock (#59). Waking from NREM is
    highest in the minutes in the field before the rat enters its house, still raised for the first hour in the house,
    and below the prediction 1–3 h after entry (#63); after natural long wakes it is as predicted (#44); the excess sits
    before the first REM, and the first REM entry itself is not specially mispredicted (#61). Adding the measured waking
    to the simulation does not reproduce the later first REM (#57): the delay sits mostly in the records that open with
    ~2 min scored NREM while the rat lies motionless in the field (#59, #62), and from the first NREM in the house the
    morning first REM is reproduced — the morning delay is the field period. 'The delay is REM-side' is withdrawn. A
    calm phase of the tested two-phase form adds nothing held out (#58, scoped to that form), and a memory of the last
    long wake adds nothing (#64). Candidate: the waking excess is well described by a single arousal (odds ×1.7, decaying
    over 20–40 min, #56; held-out gain on pass2med only); after evening rounds the first REM needs more NREM than predicted
