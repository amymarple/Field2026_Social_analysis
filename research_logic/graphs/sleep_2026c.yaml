nodes:

# ---------------------------------------------------------------- core question and competing accounts
- id: q.core
  type: question
  title: "Does sleep keep an internal history, and does it reorganise NREM/REM to cope with disturbance?"
  text: >-
    Core question (the user, 2026-10-08). The direction to connect: an individual's own sleep history, and why in the
    same group event some animals keep sleeping while others wake. Framing agreed 2026-10-07: an internal rule that
    organises sleep states, carries history and is updated during wakes; not a fixed timetable; it has to survive
    interruptions.
  status: open
  round_added: r1
  src:
    - {f: plan, l: [24, 28], a: "internal schedule"}

- id: r.q_window
  type: result
  branch: q.core
  title: "Sleep is interrupted all the time, yet daily amounts are regular"
  text: >-
    Over 08-31 → 09-06 (all 6 rats): NREM 9.7 ± 0.2 h and REM 1.8 ± 0.1 h per 24 h; REM 15.9 % of sleep. 82 % of
    REM-to-REM intervals contain some wake; the median wake bout lasts 23 s.
  status: ledger
  effect: descriptive
  inference: descriptive
  ph: [quant, plan]
  from: [an.quant]
  links:
    - {rel: proposes, to: q.core, note: "motivates the question: how do regular amounts survive constant interruption?"}
  src:
    - {f: quant, l: [23, 26], a: "NREM, h per 24 h"}
    - {f: plan, l: [31, 35], a: "82 % of REM-to-REM intervals"}
  round_added: r1

- id: h.core.regulator
  type: hypothesis
  branch: q.core
  short: internal regulation
  title: "Internal regulation that carries history"
  text: >-
    Sleep follows rules that carry a short summary of recent sleep (the PI's scheduling hypothesis as reframed with the
    user, 2026-10-07). Pattern level: says nothing about the neural implementation. How wakes update the summary is a
    separate, candidate question (Q4).
  level: pattern
  status: supported
  src:
    - {f: plan, l: [24, 26], a: "internal rule that organises sleep states"}
  round_added: r1

- id: h.core.no_history
  type: hypothesis
  branch: q.core
  short: no carried history
  title: "No carried history: clock, conditions and the current state are enough"
  text: >-
    Transitions follow the circadian clock, the conditions and the current state only (a fixed timetable or
    memoryless switching). The null against every history claim.
  level: pattern
  status: weakened
  src:
    - {f: audit, l: 59, a: "rather than a fixed timetable"}
  changes:
    - {round: r6, what: "Source re-cited after the audit's #21 wording fix (commit a3ca36e)."}
  round_added: r1

- id: h.core.tradeoff
  type: hypothesis
  branch: q.core
  short: stage trade-off
  title: "Stage trade-off (the PI's first formulation): one stage longer → the other shorter"
  text: >-
    Within a sleep cycle, stages are allocated against each other like jobs on a processor: a longer REM shortens the
    following NREM, or a longer NREM shortens the next REM.
  level: pattern
  status: weakened
  src:
    - {f: audit_v1, l: 45, a: "no trade-off"}
    - {f: lit, l: 145, a: "job-scheduler reading"}
  round_added: r1

- id: h.core.budget
  type: hypothesis
  branch: q.core
  short: sleep budget
  title: "Sleep budget: deviations are made up later (hours to a day)"
  text: >-
    A shortfall of REM or NREM is followed by a surplus, so amounts are balanced over hours or over the 24 h
    (homeostatic payback). Shown in the literature only after deprivation, never in undisturbed data.
  level: pattern
  status: mixed
  src:
    - {f: plan, l: [104, 106], a: "A budget has been shown only after deprivation"}
  round_added: r1

- id: h.core.scheduler
  type: hypothesis
  branch: q.core
  short: neural scheduler
  title: "A neural scheduler allocates NREM and REM time"
  text: >-
    The mechanistic reading: a brain circuit schedules sleep states like a job scheduler. Needs an intervention and
    neural content; natural data can only test predictive dependence on history.
  level: mechanism
  status: untestable
  src:
    - {f: audit, l: 57, a: "The brain schedules sleep"}
    - {f: audit_v1, l: 46, a: "scheduling"}
  round_added: r1

- id: r.s21
  type: result
  branch: q.core
  title: "#21 The brain schedules sleep — unresolved by design"
  text: >-
    Natural data with no intervention beyond the battery rounds cannot show a scheduling mechanism. Allowed (corrected
    2026-10-09): history-dependent, interruption-sensitive rules that reproduce the daily totals without a daily budget,
    consistent with an internal regulation of REM entry rather than a fixed timetable; a REM repayment only after
    handled interruptions (candidate); no day-to-day balance shown.
  status: unresolved
  effect: descriptive
  inference: descriptive
  ph: [audit]
  allowed: "The data show history-dependent, interruption-sensitive rules — and daily REM and NREM totals that those rules reproduce without a daily budget — consistent with an internal regulation of REM entry rather than a fixed timetable. A repayment of REM has been seen only after handled interruptions (candidate); no day-to-day balance was shown."
  forbidden: "Mechanistic 'scheduler' wording. 'Balancing / balanced over the day' (#13 withdrawn)."
  links:
    - {rel: cannot_distinguish, to: h.core.scheduler, vs: h.core.regulator, note: "rules carrying history do not identify a circuit"}
  src:
    - {f: audit, l: 59, a: "The brain schedules sleep"}
    - {f: fable_conflicts, l: [17, 36], a: "c.balance_wording"}
  changes:
    - {round: r6, what: "Allowed wording corrected by the claim audit (commit a3ca36e) after the Fable conflict review: 'balancing over the day' removed and now forbidden (c.balance_wording resolved). Old allowed wording: 'The data show history-dependent, interruption-sensitive rules and balancing over the day, consistent with an internal regulation of sleep, not a fixed timetable.'"}
  round_added: r1

- id: r.v1_11
  type: result
  branch: q.core
  title: "v1 #11 The PI's scheduling mechanism — not testable with this design"
  text: "The analysis measures statistical dependence of scored-state timing on history, not allocation."
  status: superseded
  superseded_by: r.s21
  previous_status: unresolved
  effect: descriptive
  inference: descriptive
  ph: [v1]
  src:
    - {f: audit_v1, l: 46, a: "scheduling"}
  round_added: r1

- id: j.core
  type: judgment
  branch: q.core
  title: "Rules that carry history: yes. A fixed timetable: no. A scheduler mechanism: not testable here."
  text: >-
    Established: sleep follows rules that carry history. REM becomes more likely the more NREM has built up since the
    last REM; brief awakenings do not erase that build-up; the night limits how often REM starts, not how long it
    lasts. Candidate: a long wake pushes the next REM back without resuming the earlier progress; sleep is balanced
    between night and day. Not shown: a fixed timetable, minute-for-minute compensation, outside causes of
    awakenings, a mechanism.
  status: superseded
  superseded_by: j.core.r2
  basis: [r.s21, b.final_scores, b.validation, b.no_join]
  links:
    - {rel: cannot_distinguish, to: h.core.scheduler, vs: h.core.regulator, strength: established, scope: "natural data, no intervention"}
  src:
    - {f: audit, l: [37, 51], a: "Recent sleep history predicts"}
  changes:
    - {round: r2, what: "Superseded by j.core.r2: the night-day 'balance' (#13) was withdrawn as a cohort drift (#30). Source re-pointed to the claim rows (the r1 synthesis was rewritten in the audit on 2026-10-08)."}
  round_added: r1

- id: n.manual_kappa
  type: next_step
  branch: q.core
  title: "Manual scoring of ≥ 2 h per animal against the automatic scores (κ)"
  text: >-
    Every result rests on automatic 1-s scores with no epoch-level accuracy. A manual check per animal (REM and its
    borders first) sets how far REM-based claims can go.
  priority: 14
  status: proposed
  stage: measurement
  tests: [h.core.regulator]
  outcomes:
    - {if: "κ is high for REM and NREM", then: "Current statuses stand; nothing is downgraded.", changes: [j.core]}
    - {if: "κ is low around REM borders", then: "Every REM-timing claim drops one level until rescored; #3, #6 and #14 first.", changes: [j.drive, j.carryover, j.daynight]}
  cost: "user time (manual scoring); no compute"
  src:
    - {f: audit_v1, l: 36, a: "Manual scoring"}
  changes:
    - {round: r6, what: "Priority 8 → 14 after the explore steps' next steps were added (relative order kept); the κ check now also bears on #6a, #14b, #32–#43."}
  round_added: r1

- id: h.core.entry_only
  type: hypothesis
  branch: q.core
  short: only REM entry regulated
  title: "Organising idea: only REM entry is regulated — by the count since the last REM and a smooth daily curve"
  text: >-
    Proposed by the logic audit (Fable, 2026-10-08) and kept in the claim audit's synthesis as an interpretation: REM
    entry is the regulated knob (#14: the night limits entry, not duration), REM duration and REM exits follow no history,
    and daily totals are regular because the inputs are regular, not because a budget is enforced. #40 is consistent
    with it (the generative model has history on REM entry only), but REM-bout duration and REM exits were never tested
    for regulation (step F H7, H8): stayed proposed until r8. Step F1 (r8): the same count predicts the next REM bout's
    duration (#48, established association) and night REM bouts end in waking more often at matched length (#49,
    candidate, FINAL strong) — the 'REM duration and exits follow no history' half does not hold as stated; the REM-entry
    half stands (h.model.count). The 'regular inputs, no budget' half is now h.core.regular_inputs. The claim audit's
    synthesis was rewritten on 2026-10-10 by its owner (c.entry_only_wording resolved): 'only REM entry is regulated' is
    marked superseded by #48 / #49, as the plan anticipated; the organising idea now reads that the count sets REM entry
    and also predicts the next REM bout's length, read through a smooth daily curve, with night REM ending in waking more
    often (#49, Candidate). This node keeps the original idea and its history: weakened for the REM-maintenance half.
  level: pattern
  status: weakened
  src:
    - {f: audit, l: [289, 291], a: "Organising idea (interpretation; rewritten 2026-10-10"}
    - {f: logic_audit, l: [90, 92], a: "only REM entry is regulated, by"}
    - {f: audit, l: 183, a: "the same count that sets when REM starts also predicts how long it lasts"}
  changes:
    - {round: r7, what: "Source line re-cited (the claim audit grew with #44–#55 and the part-P rows); content unchanged."}
    - {round: r8, what: "Source line re-cited (+42: the claim audit grew with #56–#64 and their sections); content unchanged."}
    - {round: r8, what: "proposed → weakened by j.core.r8: REM-bout duration follows the count (#48, established, both scorings); night REM exits differ at matched length (#49, candidate). Conflict c.entry_only_wording opened (the audit's synthesis wording is unchanged)."}
    - {round: r10, what: "The audit owner rewrote the synthesis's organising idea (2026-10-10): 'only REM entry is regulated' superseded by #48 / #49; c.entry_only_wording resolved. Status stays weakened (the maintenance half); the REM-entry half remains in h.model.count; source anchor re-cited to the rewritten line."}
  round_added: r2

- id: h.core.regular_inputs
  type: hypothesis
  branch: q.core
  short: regular inputs, no budget
  title: "Daily REM and NREM totals are regular because the inputs (when the rats are awake) are regular, not because a budget is enforced"
  text: >-
    Split off h.core.entry_only (r8). The claim audit's synthesis states it as an interpretation, since its 2026-10-10
    rewrite with the scope 'shown only conditional on the observed long wakes (#40); the unconditional test is the
    long-wake generative model'; the Fable plateau audit (2026-10-10, item 2) notes it is untested: the conditioning does
    the work. Tested only by a generative model that produces the long wakes itself (n.longwake_generative).
  level: pattern
  status: proposed
  src:
    - {f: audit, l: [292, 294], a: "regular because the inputs (the waking pattern) are regular"}
    - {f: plateau, l: 52, a: "The Synthesis's organising idea"}
  changes:
    - {round: r10, what: "Text and source re-cited to the audit's rewritten organising idea (2026-10-10: 'shown only conditional on the observed long wakes (#40)'). Status unchanged (proposed)."}
  round_added: r8

- id: j.core.r2
  type: judgment
  branch: q.core
  title: "Rules that carry history: yes. No day-to-day balance (a drift). Organising idea under test: only REM entry is regulated."
  text: >-
    Established: REM entry tracks the NREM accumulated since the last REM; brief awakenings do not erase that history;
    the night limits how often REM starts, not how long it lasts; over the 12 days all rats moved sleep from night into
    day (#30, a drift, not a balance). Candidate: a wake ≥ 7 min is not resumed; at night longer wakes delay REM
    further; the night lowers REM entry even after equally short wakes; REM missed before a morning round is repaid,
    specifically REM. Interpretation to test (the plan's scheduler model): only REM entry is regulated, by a count, a
    day/night gain and perhaps a slow REM deficit. Not shown: a day-to-day 24-h balance, a fixed timetable, an NREM
    rebound proportional to wake length, outside causes of awakenings, a mechanism.
  status: superseded
  superseded_by: j.core.r6
  basis: [r.s21, r.s30, b.final_scores, b.validation, b.no_join]
  links:
    - {rel: cannot_distinguish, to: h.core.scheduler, vs: h.core.regulator, strength: established, scope: "natural data, no intervention"}
  src:
    - {f: plan_x, l: [57, 91], a: "Where the logic stands"}
    - {f: logic_audit, l: [96, 111], a: "THE LOGIC"}
  changes:
    - {round: r3, what: "Step A: #6a (not resumed) becomes Established; #14b and #10 re-evidenced (A3 PARTIAL, A4 PASS on fixed thresholds)."}
    - {round: r4, what: "Step B: one count since the last REM, emptied by REM and fading over a wake (τ_w 5–10 min), predicts better than the feature model (#32–#34): the 'count' of the organising idea is now a fitted rule."}
    - {round: r5, what: "Step C: the night gain holds at matched count and prior wake (#14b Established); no light step beyond the smooth daily curve (#35)."}
    - {round: r6, what: "Superseded by j.core.r6 (Steps D–E: the rules reproduce daily totals without a budget; #43)."}
  round_added: r2

- id: j.core.r6
  type: judgment
  branch: q.core
  title: "Rules that carry history generate the daily sleep without a budget; a REM repayment appears only after handling"
  text: >-
    Established: REM entry is set by one count of NREM since the last REM (emptied by REM, fading over a wake), read
    through a daily curve (smooth, with no light switch: candidate, #35) that lowers entry about three-fold at night at
    the same count and prior wake; brief wakes keep the history, wakes ≥ 7 min are not resumed; simulated from these
    rules, conditional on the observed long wakes and gaps, the model reproduces daily REM and NREM and their
    day-to-day variation without any budget (#40), and beats a momentum model (#41); an NREM homeostat adds nothing to
    NREM endings (#42). Candidate: REM
    missed before a morning round is repaid by a process the rules do not contain, seen only after handled
    interruptions (#43); handling, dawn timing and the round's sleep loss are not separated, and a general slow REM
    deficit is neither shown nor excluded (low power). The budget is not needed for the daily totals but was never
    fitted ('there is no REM budget' is forbidden). Interpretation still to test: only REM entry is regulated.
    Not testable here: a neural scheduler.
  status: superseded
  superseded_by: j.core.r8
  basis: [r.s21, r.s32, r.s40, r.s43, b.final_scores, b.validation, b.no_join, b.sim_conditional]
  links:
    - {rel: cannot_distinguish, to: h.core.scheduler, vs: h.core.regulator, strength: established, scope: "natural data, no intervention"}
    - {rel: supports, to: h.core.regulator, strength: established, scope: "one count + a daily clock generate the sleep, conditional on the observed waking (#40)"}
    - {rel: weakens, to: h.core.budget, strength: established, scope: "daily REM / NREM totals and their day-to-day SD need no budget given the observed waking (#40); no budget model was fitted"}
    - {rel: weakens, to: h.core.no_history, strength: established}
  src:
    - {f: audit, l: [213, 251], a: "Synthesis, at the strongest wording"}
  changes:
    - {round: r6, what: "Fable conflict review M1: 'read through a smooth daily curve' inside the Established sentence bundled #35 (Candidate); reworded to 'a daily curve (smooth, with no light switch: candidate, #35)'. Verdicts unchanged."}
    - {round: r7, what: "Source line re-cited (the claim audit grew with #44–#55 and the part-P rows); content unchanged. The ripple round (#54–#55) bears on the count model (j.model.r6), not on this judgment's verdicts."}
    - {round: r8, what: "Superseded by j.core.r8: step F1 tested the organising idea's REM-maintenance half (#48 REM duration follows the count; #49 night REM exits), and part S found that the rules predict the amounts of sleep after a battery round but not its stability or timing (#44, #47)."}
  round_added: r6

- id: j.core.r8
  type: judgment
  branch: q.core
  title: "Rules that carry history generate the daily sleep without a budget; the same count also predicts REM duration; the rules miss the acute response to a handled round"
  text: >-
    Established: REM entry is set by one count of NREM since the last REM (emptied by REM, fading over a wake), read
    through a daily curve (smooth, with no light switch: candidate, #35) that lowers entry about three-fold at night at
    the same count and prior wake; brief wakes keep the history, wakes ≥ 7 min are not resumed; simulated from these
    rules, conditional on the observed long wakes and gaps, the model reproduces daily REM and NREM and their
    day-to-day variation without any budget (#40) and beats a momentum model (#41); an NREM homeostat adds nothing to
    NREM endings (#42); REM already taken that day adds nothing to REM entry (#52, no quota in the transitions). The
    same count also predicts how long the next REM lasts (#48, association), and brief awakenings are most frequent
    right after a REM (#51): 'only REM entry is regulated' does not hold as stated (REM duration follows the count;
    night REM exits differ, #49 candidate) — the audit's organising idea, rewritten by its owner on 2026-10-10, now reads
