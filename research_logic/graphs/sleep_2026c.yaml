    - {node: an.xc1, says: "Hazard model at the same count and prior wake: OR 0.36 / 0.30, standardised night / day ratio 0.37 / 0.34 — #14b's allowed wording says 'about three times less readily', the synthesis 'to about a third'."}
  note: "Probably two different quantities (per-episode rate ratio vs per-step hazard ratio at matched count), both inside #14b. Wording for the user; the map keeps #14b Established and quotes the allowed wording."
  round: r5

- id: c.night_day_rem
  title: "Does the no-budget model reproduce the REM night → next-day pattern?"
  status: resolved
  resolution: >-
    Day fixed effects are the governing, pre-registered term: plan §3 requires phase × day or day fixed effects for any
    baseline straddling dawn, its 'Do not' list forbids a common linear day term across dawn, and the E driver defined
    (vi) with day fixed effects before the results. With them (vi) passes on both scorings, so the linear-day result is
    not a failure of #40. #40 is now scoped to 'the night → day pattern with day fixed effects (within day, between
    animals)', with two new forbidden wordings. The linear-day REM residual (FINAL −1.16, marginally outside; pass2med
    −0.49, inside) is between-day and FINAL-only. It stays an open ledger item (r.e_vi_linear) with a proposed test
    (n.linear_day_residual); it is not read as a within-animal REM balance, nor as refuting one.
  resolved_by: "Fable review r6: day fixed effects are the pre-registered term (plan §3 and the 'Do not' list), not a failure of #40"
  sides:
    - {node: r.s40, says: "Yes with day fixed effects (the pre-registered (vi) measure): REM observed −0.36 (FINAL) / −0.03 (pass2med), inside the simulated range."}
    - {node: r.e_vi_linear, says: "With a linear day term (phase × day baselines) a negative REM slope remains: FINAL −1.16 [−1.74, −0.58], outside the simulated range (−0.91 to +1.25); pass2med −0.49, inside."}
  note: "The plan's (vi) says 'after a day term' without fixing which; D1 warned that the term matters. Under the plan's scoring rule (pass2med for cross-session contrasts) the model passes either way; FINAL with a linear day term does not. Sent for adjudication: which specification governs, and whether the REM part of #13 is fully closed."
  round: r6

- id: c.pre_rem_drop
  title: "Is there a pre-REM ripple dip within long NREM bouts — does naps report R3 still stand as a description now that the ripple model withdrew 'a transition-local drop'?"
  status: resolved
  resolution: >-
    Different quantities. R3 = the last-60-s ripple rate ÷ the same runs' −300…−120 s rate, NREM runs ≥ 300 s anchored
    at the run's end, pooled per animal × outcome (ephys/swr_rem_naps.py). K8 = the whole-bout rate before the last step:
    a −14 % last minute diluted over ≥ 5 min is ≤ −3 %, and K8's > 5-min medians differ by −2.1 / −2.4 % (same sign and
    size). K7's ρ is cumulative since the last REM and T1 is a 10-min window, so no held-out test of a last-minute term
    within long bouts exists. #55 forbids only the predictive / transition-local READING, not the measurement: R3 stands
    as a ledger description with its own allowed / forbidden wording (r.swr_r3); #55's long-bout statement is the
    whole-bout rate (r.s55, j.ripples.r7). Wording fixed by the main session: the ripple-model report (question line 21,
    reading line 350 + a new line 351, Answer item 4), the change log, and the swr_rem_naps.py docstring (said 120 s;
    the code uses 60 s). The open question went to n.rip_last_minute.
  resolved_by: "Fable review r7 (different quantities)"
  sides:
    - {node: r.swr_r3, says: "Naps report R3: in NREM runs ≥ 5 min, the last-60-s ripple rate relative to the run's own −300…−120 s rate is lower before REM than before WAKE: REM − WAKE −0.14 (p 0.025), 6/6; all events −0.09 (p 0.042), 6/6. The ripple-model report still states it as a premise: 'Ripples also drop in the last minute before REM (6/6)' (its question, line 21) and 'a gain only at L = 0 is the transition already under way, since ripples drop in the last minute before REM' (its reading and limits, line 350)."}
    - {node: r.s55, says: "Claim audit #55 forbids 'a pre-REM ripple drop as a predictive or transition-local signal' and 'ripples vanish as REM begins' (withdrawn after the Fable audit); the change log's revised reading says the signal 'is not a pre-REM ripple drop within longer bouts'; K8: in bouts longer than 5 min the whole-bout ripple rate before REM equals that before WAKE (74 vs 76 / 73 vs 75 per min); K7: no unlagged gain that holds on both scorings 60 s into a bout, none on either from 120 s."}
  note: >-
    Possibly different quantities: R3 is a within-run last-minute ratio (a description, kept and all events), while
    #55 / K7 / K8 concern the counter's held-out gain and whole-bout rates. Not decided here: whether R3 stands as a
    description (with #55 forbidding only its predictive / transition-local reading) or is withdrawn too, and whether the
    ripple-model report's lines 21 and 350 should be revised. The map keeps R3 as a ledger description and uses no
