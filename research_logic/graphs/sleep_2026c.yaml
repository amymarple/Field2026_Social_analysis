- id: q.carryover
  type: question
  short: Survives wakes?
  title: "Does the history survive interruptions — natural wakes and handled battery rounds?"
  text: >-
    Closest to the core hypothesis. Two ways to be robust to interruption: store where you are and resume, or keep the
    organisation in slow quantities that a wake barely changes. They differ in what happens after an interruption.
  status: open
  src:
    - {f: plan, l: [36, 39], a: "robust to interruption in two ways"}
    - {f: plan, l: 47, a: "carry-over curve is closest"}
  round_added: r1

