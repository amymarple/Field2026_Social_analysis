  status: resolved
  resolution: >-
    Different quantities, both correct. 'About a third' is the per-step REM-entry rate at the same count and prior wake
    (C1: OR 0.36 / 0.30; clock ratio 0.37 / 0.34); 'about half' is the model-free REM bouts per NREM hour after equally
    short wakes, count not matched (A3: 0.41 / 0.52). They should differ in this direction: at night the count runs
    higher before REM arrives and the hazard rises with the count, so realised bouts fall less than the matched hazard.
    #14b now states both, each with its measure, and forbids mixing them; #14b's status rests on C1. r.s14b and
    j.daynight.r5 updated (r6).
  resolved_by: "Fable review r6: different quantities"
  sides:
