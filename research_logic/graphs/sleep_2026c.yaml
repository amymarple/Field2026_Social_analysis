# ---------------------------------------------------------------- Q11 ripples and REM entry (r7; an LFP feature → claims belong to the next stage)
- id: q.ripples
  type: question
  short: Ripples and REM?
  title: "Do NREM sharp-wave ripples carry REM-entry information beyond the count — is the ripple-rich / REM-poor reciprocity a link or shared drivers?"
  text: >-
    The user (2026-10-09): add the NREM ripple rate to the REM-entry model as a candidate predictor, never as a nap or
    REM criterion ('the same NREM duration may contain different hippocampal activity'), and test held-out gain with
    information from before each step only. The question behind it: is 'ripple-rich, REM-poor' (naps, the early main
    sleep) a coincidence of the clock and sleep pressure, or a link? Reference model = Step B's B-full with the count
    fixed at P_tw600_k0 (count + clock + experiment day + L1 wake history + animal), both scorings. Pre-registered with
    the model's owner (Amendment 1); artifact checks (Amendment 2) and the follow-up after a read-only Fable audit
    (Amendment 3) were each written before they ran. Ripples are an LFP feature: their claims belong to the next stage
    (LFP) by the 2026-10-08 scope rule.
  status: open
  src:
    - {f: plan_rip, l: [7, 18], a: "The user wants to add ripples"}
    - {f: plan_rip, l: [91, 95], a: "Reference model"}
    - {f: audit, l: [192, 196], a: "by the 2026-10-08 scope rule"}
  round_added: r7

- id: h.rip.readiness
  type: hypothesis
  branch: q.ripples
  short: ripples carry REM readiness
  title: "Link: NREM ripples carry REM-entry information beyond the count — REM readiness tracks what happened in NREM, not only how much of it"
  text: >-
    The user's idea, tested as pre-registered: only a held-out gain from the ripple rate with its window ending 60 s
    before the step (the readiness test) supports it; a gain at lag 0 can be the transition already under way. The
    ripple counter (ripples instead of NREM minutes, P's bookkeeping) was to be read as 'how much NREM vs what happened
    in it' only if the readiness test held.
  level: pattern
  status: weakened
  src:
    - {f: plan_rip, l: [108, 113], a: "readiness test, primary for the user's question"}
    - {f: plan_rip, l: [159, 164], a: "Pre-registered reading: T2 is read"}
  round_added: r7

- id: h.rip.shared
  type: hypothesis
  branch: q.ripples
  short: shared drivers
  title: "Shared drivers: once the count, the daily clock and the wake history are known, NREM ripples add nothing about REM entry — so the reciprocity need not be a link"
  text: >-
    The plan's alternative ('a coincidence of the clock and sleep pressure'): the ripple rate and REM share both follow
    the time of day, NREM depth and the count, so the macro reciprocity needs no ripple → REM-entry link. Predictive
    level only; says nothing about what ripples do otherwise.
  level: pattern
  status: supported
  src:
    - {f: plan_rip, l: 18, a: "The question behind it"}
  round_added: r7

