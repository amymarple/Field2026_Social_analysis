    the block mean) while REM per NREM rises (0.08 → 0.21), together with depth and the clock (M1). Discriminator: the
    ripple rate against the count at matched clock, depth and time in the bout (n.rip_rate_vs_count).
  level: pattern
  status: open
  src:
