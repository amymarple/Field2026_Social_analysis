conflicts:

- id: c.rem_length
  title: "Does a longer REM lengthen the following NREM interval?"
  status: resolved
  sides:
    - {node: r.v1_08, says: "Single cycles: +0.07 [0.05, 0.10], 6/6; all cycles +0.01 (n.s.); pre-post-rule states −0.12."}
    - {node: r.s18, says: "Phase 1 cycles-ahead k = 1 (all REM cycles in a SLEEP, intervening terms controlled): −0.05 (n.s.), 3/6 — 'the classic k = 1 relation is not reproduced'."}
    - {node: r.v2_04, says: "Transition model: previous REM length adds a little (−0.31 %), sign depends on the other history terms; null in v1."}
  resolution: >-
    Different quantities: where comparable (all cycles), v1 (+0.01) and Phase 1 k = 1 (−0.05) agree on ≈ 0; +0.07 is
    the single-cycle subset and −0.12 another scoring; v2 #4 is a hazard coefficient conditional on the window terms
    (+0.13 in M1, −0.04 in M2), not an interval claim. Sayable: v1 #8's allowed wording plus #18. Settling it needs the
    two-part rerun on three scorings (n.rem_length_two_part).
  resolved_by: "Fable review r1 (v1 audit:43, Phase 1:75, v2 report:33 and 59)"
  round: r1

- id: c.delay_vs_minutes
  title: "Does a long wake delay the next REM, given that REM minutes after a wake do not depend on its length?"
  status: resolved
  sides:
    - {node: r.s06, says: "NREM before the first REM after a wake ≥ 7 min grows with ln(wake length): +0.26, 6/6 (cycles that reached REM)."}
    - {node: r.s12, says: "REM minutes over 1–3 h after natural wakes do not depend on wake length on the same events (−0.08, n.s.)."}
  resolution: >-
    Compatible, not a conflict: different events (≥ 7 min vs mostly 2–7-min wakes), outcomes and selection. Arithmetic
    from the reported numbers (not a result): +0.26 per ln unit ≈ 3 min per doubling of a ~15-min first-REM latency ≈
    0.3 min less REM in the first hour, which the same-events null (−0.08 [−0.25, +0.09]) cannot detect.
    n.survival_long_wake measures both on the same events.
  resolved_by: "Fable review r1 (Phase 2:24-27, Phase 3:130 and 151, Phase 3b:18)"
  note: "r2: #6 was split; the delay is now #6b (at night only) and the logic audit reads #6 and #12 as consistent (the hour after a long wake also carries extra NREM)."
  round: r1

- id: c.windows
