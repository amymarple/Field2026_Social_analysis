    post-round first-REM latency and REM-entry hazard against natural wakes of matched length and clock time (does the
    round act beyond the wake it causes?). (2) Dawn without an interruption: debt in the 3 h before sunrise and payback
    1–3 h after, within continuous records with no round and no long wake (is it dawn timing / a deficit released at
    the day's gate?). (3) Dose: at matched debt, does the payback slope grow with the round's gap length (the round's
