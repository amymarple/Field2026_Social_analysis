- id: r1
  date: 2026-10-08
  label: "Initial map: v1, v2, Phases 0–6, mic pilot, daily quantification"
  inputs:
    - results/2026c/ephys_spikes/reports/ephys_spikes_sleep_schedule_claim_audit_2026c.md
    - results/2026c/ephys_spikes/reports/ephys_spikes_sleep_cycles_claim_audit_2026c.md
