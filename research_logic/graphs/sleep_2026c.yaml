    - {f: plan_rip, l: [269, 270], a: "Carried by depth"}
  round_added: r7

- id: h.rip.drive_lowers
  type: hypothesis
  branch: q.ripples
  short: REM drive lowers ripples
  title: "Reverse link: the REM drive that the count tracks also lowers the NREM ripple rate — a link that a held-out test beyond the count cannot see"
  text: >-
    Proposed by this map (r7), not by a report. #54 is a predictive null beyond the count: if the process the count
