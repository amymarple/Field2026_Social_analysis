  text: >-
    The Amendment-2 reading of the counter's gain (it vanished when the last 60 s were left out), withdrawn after the
    read-only Fable audit: for steps < 60 s into a bout the lagged counter carries no within-bout information by
    construction, and 70–80 % of the gain sits there. Kept as the rival that K7 then tested where the lag can see.
  level: pattern
  status: weakened
  src:
    - {f: plan_rip, l: [199, 203], a: "K2, the pre-REM precursor"}
