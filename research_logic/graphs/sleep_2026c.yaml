    - {f: audit, l: 201, a: "not separable from how the scorer cuts REM episodes"}
  round_added: r7

- id: h.rip.brief_nrem
  type: hypothesis
  branch: q.ripples
  short: ripple-poor brief NREM
  title: "Physiology: brief NREM stretches between REM bouts of one episode are genuinely ripple-poor — a property of REM episodes, not of the scorer"
  text: >-
    The alternative to the scorer's cut, named by this map (r7) from #55's 'not separable' clause: the short NREM
    returns inside a REM episode would be real NREM of a different kind (e.g. light or intermediate sleep), poor in
    ripples. It would make the ripple counter's gain a real within-episode signal, not a scoring artefact.
  level: pattern
  status: open
  src:
