    - {f: rip, l: 15, a: "often inside a REM episode"}
  round_added: r7

- id: h.rip.depth
  type: hypothesis
  branch: q.ripples
  short: depth carries it
  title: "Depth: what the ripple counter carries about REM entry is NREM depth, not ripples as such"
  text: >-
    Pre-registered as artifact check (iii) (K4: the discount-weighted mean NREM depth since the last REM, the scorer's
    raw spectral slope) and re-run with a same-subset baseline after the Fable audit (K4b). 'Carried by depth' needs the
    ripple term to fail beyond depth while it holds alone on the same subset.
  level: pattern
  status: open
