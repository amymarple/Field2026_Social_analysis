    - {if: "(c) depth adds to P (CI < 0, ≥ n − 1 animals, control ≈ 0) AND P + depth beats depth", then: "Two processes: the count and NREM depth each carry REM-entry information (h.drive.two_processes); #4 moves toward established.", changes: [j.drive.r4, j.model.r6]}
