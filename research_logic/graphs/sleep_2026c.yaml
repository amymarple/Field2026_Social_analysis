- id: c.f1_headline
  title: "Do the F1 report's headline verdicts 'H7 HOLDS' (REM duration is unregulated) and 'H20 HOLDS' (intervals shorten within an episode) match the claims?"
  status: resolved
  sides:
    - {node: an.xf1, says: "F1 report, 'Verdicts at a glance': 'H7 | REM bout duration is unregulated | HOLDS'; 'H20 | inter-REM intervals shorten within an episode | HOLDS'."}
    - {node: r.s48, says: "#48: REM-bout duration follows the count (the opposite of 'unregulated')."}
    - {node: r.s53, says: "#53: no shortening within an episode was detected; the pooled slope is between episodes; 'ultradian progression' is forbidden."}
  resolution: >-
    Wording, not substance: H7's pass rule was 'all n.s. (scoped negative) OR a named predictor holds', so HOLDS means a
    named predictor (ln(1 + P at onset)) holds; H20's rule tested the pooled slope, which met it while the within-episode
    and same-count estimates are null. The report's final verdict table states both readings, and the claim audit words
    #48 and #53 accordingly. The map uses the audit rows. Since 2026-10-10 the F1 report carries a reading note under
    'Verdicts at a glance' (lines 9–11): 'H7 HOLDS' means a named predictor of REM duration holds (#48), 'H20 HOLDS' is
    the pooled slope only (#53). Sides quote the report as it read when the conflict was opened.
  resolved_by: "claim audit #48 / #53 (rows 183, 188) and the F1 final verdict table's reading column (lines 757, 762); reading note added to the F1 report by the main session, 2026-10-10 (lines 9–11)"
  round: r8

