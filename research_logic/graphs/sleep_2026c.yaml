    - {rel: weakens, to: h.carry.resume, strength: established, scope: "wakes ≥ 7 min (#6a); the pause loses (#34)"}
    - {rel: supports, to: h.carry.discount, strength: candidate, scope: "time scale 5–10 min (#34)"}
    - {rel: cannot_distinguish, to: h.carry.discount, vs: h.carry.hard_reset, strength: candidate, scope: "exponential vs a step at ~7 min (#34 forbids separating them)"}
