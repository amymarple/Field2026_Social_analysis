- id: j.carryover.r4
  type: judgment
  branch: q.carryover
  title: "A wake fades the count over ~5–10 min: brief wakes keep it, long wakes wipe it (not resumed); at night longer wakes delay REM further"
  text: >-
    Brief wakes keep the history (established); erasing the count at every wake is clearly worse (established). A wake
    ≥ 7 min is not resumed (established): a pause loses after long wakes. The count fades over a wake with a time
    constant of ~5–10 min (candidate strong), but a smooth discount and a step at ~7 min are not separable (the
    pre-registered comparison failed on FINAL; the 2–7-min middle is FINAL-only). Besides the NREM count, wall-clock
    time since the last REM adds (established, FINAL), its process unknown. At night longer wakes still push REM back
    (candidate), not separable from time of night; the delay is not mainly selection or post-wake fragility. Whether
    handling resets the count stays untested with power. From r8 (steps F1 / F2): within the dark, ln d holds beside
    hours since sunset on FINAL only (H5), the 2–7-min wakes are not two kinds for carry-over (H23, underpowered), and a
    new sleep site after a long wake does not detectably delay REM (H17, underpowered) — the night ramp stays wake length
    vs time of night, and step vs discount stays open. From r9 (part W): a memory of the last long wake, carried to the
    first REM and × dark, adds no held-out gain beyond the count, the preceding wake and the clock (#64); the ramp's
    direction is there, its predictive value beyond the model is not.
  status: current
  basis: [r.s05, r.s06a, r.s06b, r.s07, r.s08, r.s34, r.s36, r.c1_ramp, r.f1_h5, r.f1_h23, r.f2_h17, r.s64, b.counter_key]
