  }
}
:root[data-theme="dark"]{
  color-scheme:dark;

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(8,12,18,.3);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(500px,100vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:-12px 0 30px rgba(0,0,0,.14);z-index:21;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 20px calc(26px + env(safe-area-inset-bottom,0px))}
.dw-top{display:flex;gap:10px;align-items:center}
.dw-top .grow{flex:1}
.nid{color:var(--muted)}
.dw-t{font-size:21px;line-height:1.25;margin:10px 0 8px}
.dw-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.qchip{font:600 11.5px/1 var(--f-mono);color:var(--q);background:var(--q-bg);border:0;border-radius:4px;padding:4px 6px;cursor:pointer}
.dsec{margin-top:14px}
.dsec > .h3{margin:0 0 5px}
.dsec p{margin:0;font-size:14px}
.wording{display:grid;gap:8px;margin-top:14px}
.wording > div{border-radius:8px;padding:9px 11px;font-size:13.5px}
.wording .ok{background:var(--est-bg)} .wording .no{background:var(--rej-bg)}
.wording b{display:block;font:600 11.5px/1 var(--f-cond);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.wording .ok b{color:var(--est)} .wording .no b{color:var(--rej)}
.srcl{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;font-size:13px}
.srcl code{word-break:break-all}
.srcl .anchor{color:var(--muted);font-size:12.5px;margin-top:2px}
.srcl a{color:var(--q)}
.cp{font:12px var(--f-mono);width:100%;margin-top:4px}
.rel{margin:0 0 6px}
.rel .rl{font:600 12px/1.2 var(--f-cond);color:var(--muted)}
.rel ul{list-style:none;padding:0;margin:3px 0 0;display:flex;flex-direction:column;gap:3px;font-size:13px}
.rel li{display:flex;gap:6px;align-items:baseline}
.rel .sc{color:var(--faint);font-size:12px}
.outl{padding-left:18px;margin:0;font-size:13.5px;display:flex;flex-direction:column;gap:5px}
.ssnote{background:var(--ss-bg);color:var(--ink);border-radius:8px;padding:8px 10px;font-size:13.5px;margin-top:10px}
/* figures */
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.thumb{border:1px solid var(--line);border-radius:6px;background:#fff;padding:2px;cursor:zoom-in;line-height:0;min-width:30px;min-height:30px}
.thumb:hover{border-color:var(--q)}
.thumb img{height:52px;width:auto;max-width:130px;object-fit:contain;display:block}
.card .thumb img{height:44px;max-width:96px}
.thumb.more{font:600 12px/1 var(--f-mono);color:var(--q);background:var(--q-bg);padding:0 9px;line-height:1}
.dfigs{display:flex;flex-direction:column;gap:12px}
.dfig{margin:0}
.dfig-b{display:block;width:100%;padding:0;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:zoom-in}
.dfig-b:hover{border-color:var(--q)}
.dfig img{display:block;width:100%;height:auto;border-radius:6px}
.dfig figcaption{font-size:12.5px;color:var(--muted);margin-top:4px}
.lb{position:fixed;inset:0;z-index:40;background:rgba(5,8,12,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(14px + env(safe-area-inset-bottom,0px))}
.lb:focus{outline:none}
.lb-img{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.lb-img img{max-width:min(1500px,100%);max-height:calc(100vh - 160px);object-fit:contain;background:#fff;border-radius:4px}
.lb-bar{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;color:#e9eef4;font-size:14px;max-width:1200px;text-align:center}
.lb-count{font:500 12px/1 var(--f-mono);color:#aab4c0}
.lb-links{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;max-width:1200px}
.lb .btn{background:rgba(255,255,255,.08);color:#f2f5f8;border-color:rgba(255,255,255,.3);text-decoration:none}
.lb .btn:hover{border-color:#fff;color:#fff}
.lb-cite{font:500 12px/1.3 var(--f-mono);color:#aab4c0}
.gal-group{margin:10px 0 18px}
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.gal-item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;cursor:zoom-in;display:flex;flex-direction:column;gap:6px;text-align:left;font:inherit;color:inherit;min-width:0}
.gal-item:hover{border-color:var(--q)}
.gal-item img{width:100%;height:140px;object-fit:contain;background:#fff;border-radius:6px}
.gal-item .gc{font-size:13px;line-height:1.35}
.gal-item .gn{font-size:11.5px;color:var(--faint);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
</style>

<div class="wrap" id="app">
  <header class="top" id="top"></header>
  <nav class="legend" id="legend" aria-label="Legend"></nav>
  <section class="overview" id="overview" aria-label="Where we are"></section>
  <section class="roundbox" id="round" aria-label="This round"></section>
  <div class="sec-h"><h2>Sub-questions</h2><span class="muted">Each card reads top to bottom: competing hypotheses &rarr; the tests that address them &rarr; their results &rarr; the current judgment &rarr; the next step. Phases appear only as source tags.</span></div>

  <section id="gallery" aria-label="Figures"></section>
  <section id="conflicts" aria-label="Conflicts"></section>
  <section id="history" aria-label="Round log"></section>
  <section id="index" aria-label="All nodes"></section>
  <footer class="foot" id="foot"></footer>
</div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden tabindex="-1" aria-label="Node details"></aside>
