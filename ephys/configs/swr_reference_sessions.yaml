# User-supplied reference sessions for automating SWR detection (implementation_plan/2026-10-07-swr-detection-automation.md).
# Local read-only copies under `root` (copied from the ayadata drives W:/S:/U:/V: with SHA-256 manifests in `root`); the
# drives are never touched by the analysis. channels = DetectSWR's 1-based [ripple, sharp wave(, noise)]; params override
# swr_detect.Params (WinSize in ms; a stored DetectSWR WinSize of 50 is SAMPLES = 40 ms).
# scoring: true = DetectSWR_manual_scoring.mat from the same check run as the final ripples (idx1 = 1-NN propagation of
# the user's clicks, reproduced exactly by swr_detect.propagate_clicks; HMC1 day10 kept only the periodic save -> idx1
# rebuilt from its clicks, the last clicks may be missing). Dorsal CA1 only (user, 2026-10-07).
