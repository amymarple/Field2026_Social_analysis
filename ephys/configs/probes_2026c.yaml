# Per-animal probe definitions for cohort 2026c (WILD CE64 loggers, 64 amplifier channels @ 20 kHz).
#
# STATUS 2026-09-03 — channel map established from the data (ephys/probe_map_check.py, spike-footprint
# co-activation; details in ephys/README.md "Channel map" and the change log):
#   * WILD Console applies its CE64 export map on download (configs/wild_ce64_channel_map_v57.csv), so exported
#     columns 32-63 (raw bank 1) are in Intan-headstage order and the ProbeMaps XMLs apply to them directly.
#   * Exported columns 0-31 (raw bank 0) carry a ONE-SLOT rotation on FM64 AND FM65 (FM65 did not fix it);
#     the correction is the conjugated permutation of vendor/correct_intan_dat_channel_order.py.
#   * Each animal therefore points at an XML in EXPORTED-COLUMN numbering (xml:), generated by
#     ephys/make_probe_xml.py (ProbeMaps XML + connector orientation + per-bank rotation) or derived from the data.
#     NEVER combine such an XML with the vendor data repair (double rotation).
#
# Schema per animal:
#   probe:     ProbeMaps/Neuronexus name
#   xml:       repo-relative XML with per-shank channel groups in exported-column numbering (overrides `groups`)
#   orientation / rot_bank0 / rot_bank1:  the make_probe_xml.py parameters the XML was generated with
#   verified:  true only when probe_map_check.py --rotation-scan on THIS animal's own data picked this mapping
#   mapping_source: how the mapping was obtained (and on which sessions)
#   layout:    PreprocessPipeline chanMap layout — linear | staggered | poly2 | "Buzsaki 5x12"
#   reject_channels: exported columns always excluded (dead / broken); the XML's skip="1" channels are merged in.
#             Session-index candidates (column bad_channel_candidates) are advisory; stage_session.py --auto-reject
#             adds per-session candidates on top.
#   notes:     free text (field notes that shape interpretation)

n_channels: 64
sampling_rate_hz: 20000
default_probe_4x16: A4x16-Lin-5mm-50s-300

animals:
  SF07:
    probe: A4x16-Lin-5mm-50s-300
    xml: ephys/configs/xml/SF07_A4x16-Lin_v1raw_rot+1_0.xml
    orientation: v1_raw
    rot_bank0: 1
    rot_bank1: 0
    layout: linear
    verified: true
    mapping_source: "probe_map_check --rotation-scan on 15_20260902_082418.755 (FM65: NN-agree 0.78, bank0 1.00 n=7, bank1 0.69 n=16) and 10_20260901_234332.691 (FM65: 0.62); same winner on 2_20260901_002100.939 (FM64) | 2026-09-08: NOT a denser probe (user's impression tested with LFP only, Kilosort footprints inadmissible - old XMLs): ripple extent 4.8 of 16 channels vs 2.7-5.2 elsewhere, but SF07's profiles are nearly flat (SPW range 31-60 uV / 67-144 in the second session vs 122-938 elsewhere; ripple peak/floor 1.1-1.4 / 1.9-2.8 vs 1.8-7.6) because of a large COMMON-MODE signal on all 64 channels: between-shank 300-3000 Hz correlation 0.50-0.58 vs 0.08-0.18, PC1 51-59 % vs 12-23 %, in both sessions -> reference/ground path of that implant; grouping unaffected, but SF07 stays unusable as an LFP control"
    reject_channels: []
    notes: "17 sessions offloaded 2026-09-02 (0-7 FM64, 8-16 FM65); all 64 channels alive; 125 GB card"
  SF08:
    probe: A4x16-Lin-5mm-50s-300
    xml: ephys/configs/xml/SF08_A4x16-Lin_dataorder_20260908.xml
    orientation: data-derived order (LFP test #3, user-inspected 2026-09-08)
    rot_bank0: 1
    rot_bank1: 0
    layout: linear
    verified: true
    mapping_source: "FM65 scan 13_20260902_082748.094 (600 s, 19 strong pairs, 2026-09-04): shank GROUPING = SF07's (co-activation clusters fall inside SF07's groups, purity 0.90); within-shank ORDER matches no orientation x bank rotation of A4x16-Lin / A4x16-Poly2-20s-lin-160 / A4x16-Poly2-23s-200-177 (NN <= 0.31); probe design unknown (user 2026-09-04: SF07's layout differs from the others) -> valid for per-shank sorting only, no depth/geometry claims | 2026-09-08 LFP test #3 on the staged FIRST 10 min of 18_20260903_060030.122 (440 ripples, read-only copy): SF07's XML used ONLY for the shank column sets (same under all matings; SF08 grouping confirmed by co-activation + spike-band partners) - SF07's order is its own mating, not a reference (user); under the ProbeMaps standard order all four shanks are jagged (spw tv 2.7-4.6) and none of the 3600 physical matings incl. pin shifts is smooth; CANDIDATE LFP-derived order ephys/configs/xml/SF08_A4x16-Lin_dataorder_20260908.xml (copy: stage/SF08/18_20260903_060030.122__w0s_600s/amplifier.xml) AWAITING THE USER'S NEUROSCOPE CHECK - xml: above deliberately unchanged. Flags: cols 53 and 55 carry the SAME signal (r 0.97, identical SPW/ripple/theta; ADJACENT connector-B pins r2c2/r2c3 -> a bridged pin pair, like SF12's clusters; confirmed by the difference test: a-b = amplifier noise, 0 events/s vs 8.4/s), one of them should become skip; col 47 correlates with nothing (r <= 0.12) and has an odd theta phase (-17 deg) -> suspect site; no connector-row impedance split like SF10's; deep-site pin pattern differs from SF10's (different wiring) | user 2026-09-08: 'SF8 不错' -> ADOPTED; 55 skipped in place (bridged with 53); group order 1-2-3-4 (SF12 kept the same, user 2026-09-08)"
    reject_channels: [32, 55]     # 32 flat (pace maker at its gradient gap); 55 bridged with 53, skip in place, user 2026-09-08
    notes: "Notion 'Logger Channels Count' 63; glitch load highest of the fleet (~1,350 ticks/s on FM64)"
