# Per-animal probe definitions for cohort 2026c (WILD CE64 loggers, 64 amplifier channels @ 20 kHz).
#
# STATUS 2026-09-03 — channel map established from the data (ephys/probe_map_check.py, spike-footprint
# co-activation; details in ephys/README.md "Channel map" and the change log):
#   * WILD Console applies its CE64 export map on download (configs/wild_ce64_channel_map_v57.csv), so exported
#     columns 32-63 (raw bank 1) are in Intan-headstage order and the ProbeMaps XMLs apply to them directly.
#   * Exported columns 0-31 (raw bank 0) carry a ONE-SLOT rotation on FM64 AND FM65 (FM65 did not fix it);
#     the correction is the conjugated permutation of vendor/correct_intan_dat_channel_order.py.
#   * Each animal therefore points at an XML in EXPORTED-COLUMN numbering (xml:), generated by
#     ephys/make_probe_xml.py (ProbeMaps XML + connector orientation + per-bank rotation) or derived from the data.
#     NEVER combine such an XML with the vendor data repair (double rotation).
#
# Schema per animal:
#   probe:     ProbeMaps/Neuronexus name
#   xml:       repo-relative XML with per-shank channel groups in exported-column numbering (overrides `groups`)
#   orientation / rot_bank0 / rot_bank1:  the make_probe_xml.py parameters the XML was generated with
#   verified:  true only when probe_map_check.py --rotation-scan on THIS animal's own data picked this mapping
#   mapping_source: how the mapping was obtained (and on which sessions)
#   layout:    PreprocessPipeline chanMap layout — linear | staggered | poly2 | "Buzsaki 5x12"
#   reject_channels: exported columns always excluded (dead / broken); the XML's skip="1" channels are merged in.
#             Session-index candidates (column bad_channel_candidates) are advisory; stage_session.py --auto-reject
#             adds per-session candidates on top.
#   notes:     free text (field notes that shape interpretation)

n_channels: 64
sampling_rate_hz: 20000
default_probe_4x16: A4x16-Lin-5mm-50s-300

animals:
  SF07:
    probe: A4x16-Lin-5mm-50s-300
    xml: ephys/configs/xml/SF07_A4x16-Lin_v1raw_rot+1_0.xml
    orientation: v1_raw
    rot_bank0: 1
    rot_bank1: 0
    layout: linear
    verified: true
    mapping_source: "probe_map_check --rotation-scan on 15_20260902_082418.755 (FM65: NN-agree 0.78, bank0 1.00 n=7, bank1 0.69 n=16) and 10_20260901_234332.691 (FM65: 0.62); same winner on 2_20260901_002100.939 (FM64)"
    reject_channels: []
    notes: "17 sessions offloaded 2026-09-02 (0-7 FM64, 8-16 FM65); all 64 channels alive; 125 GB card"
  SF08:
    probe: A4x16-Lin-5mm-50s-300
    xml: ephys/configs/xml/SF07_A4x16-Lin_v1raw_rot+1_0.xml
    orientation: v1_raw
    rot_bank0: 1
    rot_bank1: 0
    layout: linear
    verified: false
    mapping_source: "FM65 scan 13_20260902_082748.094 (600 s, 19 strong pairs, 2026-09-04): shank GROUPING = SF07's (co-activation clusters fall inside SF07's groups, purity 0.90); within-shank ORDER matches no orientation x bank rotation of A4x16-Lin / A4x16-Poly2-20s-lin-160 / A4x16-Poly2-23s-200-177 (NN <= 0.31); probe design unknown (user 2026-09-04: SF07's layout differs from the others) -> valid for per-shank sorting only, no depth/geometry claims"
    reject_channels: [32]     # flat channel: HP noise 1.5 uV vs ~10 uV elsewhere on 0_20260831_190133.486 (Notion: '63 channels')
    notes: "Notion 'Logger Channels Count' 63; glitch load highest of the fleet (~1,350 ticks/s on FM64)"
  SF09:
    probe: A5x12_16-Buz_lin-5mm-100-200-160_177
    xml: ephys/configs/xml/SF09_data_derived_3_20260831_190834.640.xml
    orientation: null
    rot_bank0: null
    rot_bank1: null
    layout: linear            # data-derived groups have no geometry; per-shank sorting only
    verified: false
    mapping_source: "DATA-DERIVED (probe_map_check --derive-xml on 3_20260831_190834.640, 600 s, FM64): 74 strong pairs fit NONE of the 4 connector orientations x bank rotations (-4..+4) of the ProbeMaps A5x12 XML (best 0.61 same-shank, expected ~0.9+). 7 co-activation clusters used as shanks (35 channels), 29 channels unassigned -> skip. Needs the true pin table or an FM65 re-check. | 2026-09-04 re-test on FM65 10_20260902_083015.335 with the 16 connector matings (per-connector 180-deg rotation, swap, mirror) x bank rotations: co-activation 93 strong pairs, best same-shank 0.51 (no winner); unit-footprint test on 60 KS4 units: best spread 185 um, same-shank <= 0.50, no margin -> the ProbeMaps A5x12 site->pin table does not describe this implant under any mating; data-derived groups stay"
    reject_channels: []       # index 2026-09-02 candidates on EVERY SF9 session: 2 4 32 36 54 56 58 62 (+52 60 on short records); the data-derived XML already skips the unassigned channels
    notes: "Notion 'Logger Channels Count' 50 -> ~14 channels expected dead/unused"
  SF10:
    probe: A4x16-Lin-5mm-50s-300
    xml: ephys/configs/xml/SF07_A4x16-Lin_v1raw_rot+1_0.xml
    orientation: v1_raw
    rot_bank0: 1
    rot_bank1: 0
    layout: linear
    verified: true
    mapping_source: "probe_map_check --rotation-scan on 9_20260902_083247.835 (FM65, 600 s, 2026-09-04): winner = SF07's map v1_raw +1/0 (same-shank 0.89 of 54 strong pairs, NN 0.40, bank0 order 0.76 n=21, bank1 order 0.08 n=24 -> bank-1 depth order still weak, grouping solid)"
    reject_channels: []       # index 2026-09-02 candidates on every SF10 session: 32 34 (+2 6 56 60 62 63 on some) — review, then move here
    notes: "8/25 note: '1 shank super noisy' after wire fix; night-1 brownout 03:27 (session lost regardless)"
  SF11:
    probe: A4x16-Lin-5mm-50s-300
    xml: ephys/configs/xml/SF07_A4x16-Lin_v1raw_rot+1_0.xml
    orientation: v1_raw
    rot_bank0: 1
    rot_bank1: 0
    layout: linear
    verified: false
    mapping_source: "FM65 scan 12_20260902_083534.755 (600 s, 22 strong pairs, 2026-09-04): shank GROUPING = SF07's (co-activation clusters fall inside SF07's groups, purity 0.96); within-shank ORDER matches no orientation x bank rotation of A4x16-Lin / A4x16-Poly2-20s-lin-160 / A4x16-Poly2-23s-200-177 (NN <= 0.42); probe design unknown (user 2026-09-04: SF07's layout differs from the others) -> valid for per-shank sorting only, no depth/geometry claims"
    reject_channels: []       # index 2026-09-02 candidates on the 09-01 SF11 records: 32 56 60; the 08-31 07:24 record had ch 32-63 flat (regime, not probe)
    notes: ""
  SF12:
    probe: A4x16-Lin-5mm-50s-300
    xml: ephys/configs/xml/SF07_A4x16-Lin_v1raw_rot+1_0.xml
    orientation: v1_raw
    rot_bank0: 1
    rot_bank1: 0
    layout: linear
    verified: false
    mapping_source: "FM65 scan 11_20260902_083748.804 (600 s, 67 strong pairs, 2026-09-04): shank GROUPING = SF07's (co-activation clusters fall inside SF07's groups, purity 0.88); within-shank ORDER matches no orientation x bank rotation of A4x16-Lin / A4x16-Poly2-20s-lin-160 / A4x16-Poly2-23s-200-177 (NN <= 0.39); probe design unknown (user 2026-09-04: SF07's layout differs from the others) -> valid for per-shank sorting only, no depth/geometry claims"
    reject_channels: []
