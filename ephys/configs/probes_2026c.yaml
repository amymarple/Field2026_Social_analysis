- awaiting the user's Neuroscope check; caveat: v2 shanks 2/3/4 interleave pyramidal and radiatum columns and the spike-band correlation blocks match v2 42/54, v1 38/54, this co-activation XML 50/54 | 2026-09-08 (later) GEOMETRY: the ProbeMaps coordinate table shows the four 12-site shanks span only 110 um (tip clusters, one depth each) while the 16-site middle shank spans 2700 um (13 sites at 100 um + 3 at 500 um) -> only the middle shank has a real within-shank depth order, and only it may hold both SPW polarities. On that criterion version1 beats version2 (v1 middle shank = cols 14 12 11 13 7 47 15 39 46 45 35 43 17 3 42 44 reading +272..-857 monotone, tv 1.13; two v1 tip clusters sign-uniform; v2 violates in 4 of 5 groups). CANDIDATE ephys/configs/xml/SF09_A5x12-Buz_v1grouping_dataorder_20260908.xml (staged as amplifier.xml) awaiting the user's check; v1 groups 1-2 (bank-1 heavy, 4 dead columns each) still mix polarities and are unresolved | 2026-09-08 (III) RECONSTRUCTED ephys/configs/xml/SF09_reconstructed_20260908.xml (staged as amplifier.xml): datasheet A5x12-16-Buz - centre shank = 3 cortical sites 500 um apart (cols 21 51 55: ripple at the floor 13-17 vs 29-110, max r to anything 0.09-0.18) + 13 sites at 100 um; side shanks = 20-um tip clusters. Groups rebuilt from the spike-band correlation, NOT from a ProbeMaps mating; centre ladder -62..-857 uV, steps median 56, ripple 80->29, neighbour r 0.27 vs 0.15 distant. v2 after the user's question about a sixth group: cols 0/29/59 moved from the centre to side shank C (r 0.36-0.40 vs 0.15-0.17), which makes the counts close exactly on the design 12/12/16/12/12 - every dead column now sits inside a shank with skip=1 and there is NO trailing group; which bank-1 dead column belongs to C/D/centre is undetermined (flat channels, group spread 0.03-0.05), only the counts (1/5/2) are; group order = side, side, CENTRE, side, side by depth (assumes a monotone gradient across the row); awaiting the user's check"
    reject_channels: []       # index 2026-09-02 candidates on EVERY SF9 session: 2 4 32 36 54 56 58 62 (+52 60 on short records); the data-derived XML already skips the unassigned channels
    notes: "Notion 'Logger Channels Count' 50 -> ~14 channels expected dead/unused"
