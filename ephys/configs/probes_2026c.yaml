# Per-animal probe definitions for cohort 2026c (WILD CE64 loggers, 64 amplifier channels @ 20 kHz).
#
# *** STATUS: channel -> shank mapping is UNVERIFIED (2026-09-02). ***
# The Notion cohort page gives only the probe FORM FACTOR (SF07/08/10/11/12 = "4*16", SF09 = "5*12"); no
# logger-channel -> probe-site table exists in the repos or on disk (every existing amplifier.xml is one
# 64-channel group). The groups below are a PLACEHOLDER: sequential 16-channel blocks (SF09: Buzsaki 5x12
# = [12,12,16,12,12]). Kilosort4 units are still valid per unit, but any shank / depth / geometry claim is
# blocked until this file is confirmed against the headstage-adapter pinout or ephys/probe_group_check.py.
# Set `verified: true` (and record the source) once confirmed.
#
# Schema per animal:
#   layout:   PreprocessPipeline chanMap layout — staggered | linear | poly2 | poly3 | double_sided | "Buzsaki 5x12"
#   groups:   list of channel lists (0-based logger channels), one per shank, in shank order
#   reject_channels: 0-based channels always excluded (dead / broken). Data-driven candidates are listed in the
#             session index (ephys_spikes_session_index_<cohort>.csv, column bad_channel_candidates) — copy the
#             stable ones here; stage_session.py --auto-reject adds per-session candidates on top.
#   notes:    free text (field notes that shape interpretation)

verified: false
mapping_source: "PLACEHOLDER sequential blocks — no pinout table found (2026-09-02); confirm with the probe adapter map"
