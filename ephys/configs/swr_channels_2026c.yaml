# SWR detection channels per animal x probe block, cohort 2026c (plan: implementation_plan/2026-10-07-swr-detection-automation.md).
# Columns are 0-BASED exported columns (= Neuroscope channel numbers, the numbering of the final channel maps in
# ephys/configs/xml/*_lfporder_2026100[67].xml = Q:/.../3rd_rat/analysis/channel_maps_final_20261006/); DetectSWR's
# 1-based channel = column + 1.
# Proposed by ephys/swr_channel_scan.py on one NREM-rich, stable session per block (the 2-h window with the most NREM;
# outputs, incl. a per-shank profile figure, in D:/Field2026_analysis_out/2026c/swr_channel_scan/), 2026-10-07:
#   ripple_col     the largest ripple-band ratio (80-250 Hz envelope at NREM ripple peaks / at random times)
#   sharpwave_col  the most negative sharp wave below it on its shank; else the most negative anywhere (cross-shank, as in
#                  the lab's PPP4 run); else - no reversal on the probe = above the pyramidal layer - the least positive
#                  site on the ripple shank (flagged). Since 2026-10-08 the sharp wave is spw_ref_uV (the team's
#                  lfp_profile_check events + a baseline-subtracted 1-50 Hz mean): the first scan's loose events had
#                  lifted the top sites by ~30-100 uV and hidden the sign change on SF11 / SF12 block 3 (the user: "SF11
#                  SF12 should have a reversal"). The spw values in `source` below are the first scan's; spw_ref per
#                  block in `spw_ref`.
#   noise_col      among each shank's top 3 live sites, the least ripple (user rule 2026-10-07: cortical, top, ripple-free)
#   shank_ripple   per shank, its own largest-ripple site (multi-shank consistency flag)
#   reference_session  the session whose NREM fit sets the block's boundary + theta/EMG thresholds (swr_auto --fit block)
#   valid_from     block start = the exact start of the first post-move session (regime-aware-ephys table); null = cohort start
#   skip           true = no detection in this block
#   boundary_features  ripple = classify on ripple power only (blocks with no clear sharp-wave reversal: SF07, SF11, SF12
#                  block 3; default both)
#   exclude_cols   columns never used in this block (e.g. for the LFP-EMG): per-period failures from the record
#   confirmed      true once the user has looked at it (profile figure / Neuroscope / GUI); all confirmed by the user 2026-10-08
