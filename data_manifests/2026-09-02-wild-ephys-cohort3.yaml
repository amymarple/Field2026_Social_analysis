# Data manifest — WILD CE64 neurologger raw offloads, 3rd rat cohort (SF07–SF12), cohort key 2026c
# See implementation_plan/2026-09-02-ephys-spike-sorting-pipeline.md and cohorts/2026c.yaml (ephys: block).
# The per-session machine-readable registration is results/2026c/ephys_spikes/reports/ephys_spikes_session_index_2026c.csv
# (regenerated by ephys/build_session_index.py; mirrored as E:\3rd_rat_spikes\SESSION_INDEX.*).

run_name: wild_ephys_cohort3_2026-09-02
experiment: Field_2026_Social — 3rd rat cohort, 6 Long-Evans rats (SF07–SF12) with head-mounted WILD CE64 neurologgers, outdoor 40x20 ft paddock, released 2026-08-30 ~19:00 EDT
timezone:
  data_clock: logger RTC, set from the field-PC LOCAL clock (EDT, UTC-04:00) at each Resync; session folder name = RTC start with ms
  drift: field PC free-runs (+2.1 s/day fast, W32Time disabled 2026-09-01); logger vs PC offset ("dev") 0.5–1.6 s overnight; per-session PC-time fit needed for cross-modal alignment (UNVERIFIED until run)
units:
  amplifier: int16 ADC counts; microvolt scale NOT in the WILD header — the Intan default 0.195 uV/count is used as a RELATIVE scale (unverified)

animals_loggers:
  note: animal = SFxx (field ID); logger = 12-hex MAC (offload folder); Notion "Probename" = last 4 hex of the MAC
  SF07: {logger_mac: D0DBEFEF3111, probe: "4x16", offloaded: "2026-09-02 (17 sessions 08-31 18:58 -> 09-02 18:12; 0-7 FM64, 8-16 FM65 = first FM65 field data)"}
  SF08: {logger_mac: 128C2F27E131, probe: "4x16", channels_reported: 63, dead_channels_observed: [32]}
  SF09: {logger_mac: 68BDFFFF62DB, probe: "5x12 (Buzsaki)", channels_reported: 50}
  SF10: {logger_mac: CACB6D600151, probe: "4x16", note: "one shank super noisy after the 8/25 wire fix"}
  SF11: {logger_mac: 1DFE7F77721C, probe: "4x16"}
  SF12: {logger_mac: FBED2F2321B1, probe: "4x16"}
  channel_to_shank_map: UNVERIFIED — placeholder sequential blocks in ephys/configs/probes_2026c.yaml; no pinout table found on disk (2026-09-02)

datasets:

  - name: raw_sessions
    role: canonical raw neural offloads (READ-ONLY; never modified in place)
    path: E:\3rd_rat_spikes\<SFxx>\<logger_mac>\<slot>_<YYYYMMDD>_<HHMMSS>.<ms>\
    files:
      amplifier.dat: int16, 64 channels interleaved, 20000 Hz (2.48 MB/s; ~2.3 GB/h; a 12-h session ~50 GB)
      info.rhd: Intan RHD2000 header generated by the logger toolchain (64 amplifier + 16 ADC channel groups)
      CE_params.bin: logger header (fs, Nch, firmware_version @328, hw_version, RTC start, MAC, SD capacity)
      time.dat: int32 sample index 0..N-1
      analogin.dat: 16 misc lanes @ 1250 Hz (fs/16); lanes 14/15 = packed BLE PC-time anchors (~5 s cadence while connected)
      digitalin.dat, supply.dat: sidecars (supply = slow ADC readings; steps at the defect-B sample)
      adc.dat, misc.dat: empty (no audio / camera on these loggers)
    coverage_2026-09-02: 37 sessions, SF08–SF12, starts 2026-08-31 07:01 -> 2026-09-01 05:49 EDT (SF07 not yet offloaded)
    duplicates: partial earlier copies on G:\3rd\ (SF8/SF10/SF11) and D:\SF10\ — E: is canonical

  - name: recovery_images
    role: forensic card images for a FUTURE recovery attempt; NOT parsed by any tool
    path: E:\3rd_rat_spikes\<SFxx>\recovery.bin
    size_bytes: ~512 GB each (one per animal SF7–SF12)
    reason: FM59–62 firmware registered a session file only at a clean Record Stop; night 1 (2026-08-30 18:39 -> 08-31 ~04:30) was pulled without Stop on all six loggers, so those sessions exist only as unregistered card regions (partly overwritten by the morning restarts; maker verdict "not realistically recoverable")

firmware_provenance:              # read per session from CE_params.bin; the rule that decides validity
  FM62: {sessions: "2026-08-31 07:0x–08:31 starts", defects: "stop-only commit + single-sample glitch defects A/B", action: de-glitch before any analysis}
  FM64: {sessions: "2026-08-31 19:0x -> 2026-09-01 05:4x starts", defects: "glitch defects A/B ('artificial spikes'); stop-only commit", action: de-glitch before any analysis}
  FM65: {sessions: "started after the 2026-09-01 ~19:30 round", defects: "none on the maker's bench record", action: "copy verbatim; measured ticks_per_s in the session index is the evidence — UNEVALUATED until offloaded"}
  defect_A: per-sample channel substitution (a sample carries another fixed channel's value; both polarities; ~100–1,400 ticks/s summed over 64 ch)
  defect_B: 15-s housekeeping injection (one-sample deflection to ~-21,650 ADC synchronised across channels; two interleaved 15-s trains)
  cleaning: ephys/deglitch_wild.py = numerical port of field2026-sync from-field/2026-09-01_deglitch_wild.py (5-pt running median; replace |x-med5| > max(10*1.4826*MAD, 500 ADC)); validated on SF10 5_20260901_054403.494 — 108,584 samples replaced (0.17 %), ticks 23,679 -> 64 (99.7 %), reproduced exactly by the port on 2026-09-02

excluded:
  - window: 2026-08-30 18:39 -> 2026-08-31 ~04:30 EDT (night 1)
    reason: neural data lost on all six loggers (uncommitted sessions); video/WISER/audio unaffected
  - window: 2026-08-31 ~11:00 -> 18:00 EDT
    reason: daytime troubleshooting (ad-telemetry freeze, WB55 disconnects, handling, reflashes) — logger LFP blank; analysis exclusion
  - window: SF08 2026-09-01 ~14:00 -> 15:30 EDT
    reason: mid-day battery death (undercharged cell); session auto-stopped, data to ~13:45 safe

derived_outputs:
  staged_clean_copies: G:\Field2026_analysis_out\2026c\ephys_stage\<SFxx>\<session>\   (amplifier.dat de-glitched or verbatim; info.rhd; CE_params.bin; time.dat; <session>.xml; stage_manifest.json; deglitch_report.csv)
  sorting: G:\Field2026_analysis_out\2026c\ephys_sort\<SFxx>\<session>\   (PreprocessPipeline .dat/.lfp/session.mat + Kilosort4_<ts>[ _spi ] Phy folders + sort_manifest.json)
  index: results/2026c/ephys_spikes/reports/ephys_spikes_session_index_2026c.{csv,md,json}

alignment_notes:
  - cross-modal (video / WISER / audio) alignment is UNVERIFIED until WILD_generate_pc_time.py (Neurologger repo, run on the RAW folder) publishes a per-session fit with anchors within 60 s of both ends, >=10 anchors, >=80 % span coverage
  - sub-ms alignment must use the 1 Hz LED edges in the camera view, not the BLE PC-time path (~10–100 ms class)
