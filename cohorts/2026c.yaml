      - {animal: SF10, on_from: "2026-09-10 14:51:32", off_at: "2026-09-10 20:55:47", note: "day 14:51:22-18:49:40 (ON 10 s after Start), guard stub 19:43:55, night piece 19:44:42-20:53:23"}
      - {animal: SF12, on_from: "2026-09-10 15:04:40", off_at: "2026-09-10 21:04:59", note: "day 15:04:57-18:51:05, night piece 19:47:10-20:42:47; the 14:54:09-~15:01 stub is CLEAN (no ON block)"}
