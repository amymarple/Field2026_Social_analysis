# Cohort descriptor — the ONLY file you add/edit to register a cohort (see cohorts/2026a.yaml for the schema).

cohort: 2026c
label: "3rd rat cohort (SF07–SF12, 6 animals, WILD neurologger implants; released 2026-08-30 ~19:00 ET)"
description: >
  Third Field_2026_Social outdoor rat cohort in the 20x40 ft paddock, first cohort with head-mounted WILD CE64
  neurologgers (64 ch @ 20 kHz on SD, BLE sync) on every animal. Multimodal as before: WISER/UWB, Reolink video
  (8 ch), thermal, camera mics, Ambient Weather, plus the new ephys modality (ephys/).
  Field notes: Notion "4-Rat 3rd cohort — full (SF07–SF12)".

date_range:
  start: "2026-08-30"
  end: null            # open — cohort running; extend when it closes
timezone_wallclock: "America/New_York"   # logger RTC is set from the field-PC local clock at Resync (EDT)

identities: wiser/configs/rat_identities.csv   # WISER shortid -> animal (cohort-3 tags: see notes)

# ---------------------------------------------------------------------------------------------------------
# Ephys (WILD neurologger) — read by ephys/*.py
# ---------------------------------------------------------------------------------------------------------
ephys:
  direction: ephys_spikes
  # Raw offload layout: <root>/<animal>/<logger_mac>/<slot>_<YYYYMMDD>_<HHMMSS>.<ms>/{amplifier.dat,...}
  # <animal>/recovery.bin = raw 512 GB card image kept for a FUTURE forensic recovery of the FM59-62
  # uncommitted (stop-only-commit) sessions. Never parsed by the pipeline; never delete.
  session_glob: "[0-9]*_[0-9]*_[0-9]*"
  n_channels: 64
  sampling_rate_hz: 20000
  dtype: int16
  gain_to_uV: 0.195          # Intan RHD default; the WILD header carries no scale -> RELATIVE, unverified
  # Animal -> logger MAC (last 4 hex = the Notion "Probename" column). SF07 offloaded 2026-09-02 (17 sessions,
  # 08-31 18:58 -> 09-02 18:12; sessions 0-7 FM64, 8-16 FM65).
  loggers:
    SF07: {mac_suffix: "3111", mac: "D0DBEFEF3111"}
    SF08: {mac_suffix: "E131", mac: "128C2F27E131"}
    SF09: {mac_suffix: "62DB", mac: "68BDFFFF62DB"}
    SF10: {mac_suffix: "0151", mac: "CACB6D600151"}
    SF11: {mac_suffix: "721C", mac: "1DFE7F77721C"}
    SF12: {mac_suffix: "21B1", mac: "FBED2F2321B1"}
  # Firmware provenance (field history, confirmed from CE_params.bin firmware_version @ byte 328):
  #   FM59-62  stop-only file commit (night-1 loss on all six) AND single-sample glitch defects
  #   FM64     glitch defects ("artificial spikes": channel-substitution ticks + 15-s housekeeping spikes)
  #   FM65     maker fix for both (2026-09-01 ~19:30 round) — UNEVALUATED until offloaded data is indexed
  firmware_history:
    62: "stop-only commit (session exists only after a clean Record Stop) + glitch defects A/B"
    64: "glitch defects A/B (~100-1400 ticks/s summed over 64 ch); stop-only commit"
    65: "maker fix, both parts now VERIFIED. Glitch defects absent: measured clean on all six loggers over 94 field sessions (240.8 h) - see the offload QC report. Power-cut-safe commit: survives a HARD power cut (battery pulled mid-recording), tested by the operator 2026-09-04; and the logger's own low-battery auto-stop closes the files byte-exact - SF09 2_20260903_075655.297 (8.713 h) and SF07 4_20260903_001558.656 (4.039 h) both have amplifier.dat a whole number of 128-byte samples, time.dat = 4 x n_samples and analogin.dat = 2 x n_samples. Consequence for the field protocol: a mid-night Stop->Start restart is no longer needed as insurance, so the midnight BLE touch can be a mid-session anchor instead of a session start - worth ~50 ms on the unanchored tail (see change_log 2026-09-04)"
  clean_firmware_min: 65     # sessions with firmware_version < this MUST be de-glitched before any analysis
  # Field-PC clock steps (w32time stepping the PC FORWARD; the PC free-runs ~2.1 s/day SLOW, the loggers' uniform
  # -21..-27 ppm apparent drift is that rate). Measured 2026-09-03 from the field PC's 1-Hz LED-sync log
  # (from-field/2026-09-03_ledsync_*.txt: a pulse sent late by the step size and the following seconds skipped) and
  # confirmed by the BLE anchors + card-vs-PC spans of every session spanning them. Video, WISER and LED timestamps
  # carry the same clock, so pc_time.dat must INCLUDE the step; the fit subtracts it, then adds it back.
  # time = field-PC local wallclock (EDT) just before the jump; jump_s = new minus old clock.
  field_pc_clock_steps:
    # w32time steps: EXACT from the Windows System log (Kernel-General Id 1, old -> new in 100-ns ticks; field2026-sync
    # from-field/2026-09-04_cohort3-pc-clock-change-events.csv). Each step is one large set plus two sub-ms re-adjustments.
    - {time: "2026-08-30 13:23:19", jump_s: 2.3067, source: "Kernel-General Id 1 event 17:23:17.1289863 -> 17:23:19.4356624 UTC; confirmed by event. Before any recorded session (night-1 sessions were never committed), no fit uses it"}
    - {time: "2026-08-31 09:00:19", jump_s: 2.4164, source: "Kernel-General Id 1 event 13:00:16.8782911 -> 13:00:19.2947288 UTC; confirmed by event (was 2.386 s at 09:00:17 from the LED log)"}
    - {time: "2026-09-01 13:09:12", jump_s: 2.5487, source: "Kernel-General Id 1 event 17:09:10.0116962 -> 17:09:12.5603560 UTC; confirmed by event (was 2.6 s at 13:09:11 from anchors + LED log). No further w32time step exists; W32Time disabled 2026-09-01 19:00"}
    # Reboots: Windows does NOT log the boot-time clock load from the hardware RTC (no old time to log; Kernel-Boot 238 is
    # 1-s resolution), so a reboot step can only be measured. 2026-09-01 04:22 reboot: any step was absorbed by the 13:09
    # w32time step (w32time still running) - if the 04:22 -> 13:09 sessions ever fit badly, look there first.
    - {time: "2026-09-03 13:56:01", jump_s: 1.28, source: "measured value final (not loggable by Windows). PC bugcheck reboot 13:56:01-13:59:05. Field drift log (NTP minus PC): +92.4 ms/h before, +91.0 ms/h after, residuals 10/4 ms, lines differing by 1.263 s at the reboot; free-step BLE anchor fits SF08 2_ 1.265, SF11 3_ 1.281, SF12 3_ 1.319 s (step/slope 0.96-0.99 anti-correlated, so the 54 ms spread is the real uncertainty). Adopted 1.28 +- 0.04 s. Future reboots: the drift-check task now also fires 5 min after boot (2026-09-05 01:16)"}
  # Field-PC outages (PC-side modalities only; the loggers record on their own). Not clock steps: the LED log resumes
  # with sched == timestamp after each reboot. From from-field notes / System log.
  field_pc_outages:
    - {start: "2026-09-01 04:20:14", end: "2026-09-01 04:22:40", cause: "bugcheck 0x1E (BSOD), auto-logon"}
    - {start: "2026-09-03 13:56:01", end: "2026-09-03 13:59:05", cause: "bugcheck 0x1E (same ntoskrnl fault); video/thermal/mic/LED/WISER gap ~3 min"}
  # Probe advances (turns of the microdrive). The move sits inside a Stop -> Start gap, so no session needs splitting,
  # but the sites sit in DIFFERENT TISSUE before and after: sort the epochs separately and NEVER merge unit identities
  # across a move. settle_h = the post-move window to treat as unstable (drifting / appearing / disappearing units).
  # Source: field2026-sync from-field/2026-09-04_probe-move-sf07-sf11.md (operator HC, console log + incident log).
  probe_moves:
    - {animal: SF07, time: "2026-09-04 14:00:54", turns: 0.25, direction: advance, prev_session_stop: "2026-09-04 13:40:27", settle_h: 4}
    - {animal: SF11, time: "2026-09-04 13:56:50", turns: 0.25, direction: advance, prev_session_stop: "2026-09-04 13:41:26", settle_h: 4}
    # Second advances 2026-09-05 (recording repo BATTERY_LOG_cohort3.md 9/5 row, commits 11f6cbb / 5a76417): the session was
    # stopped, the probe turned, and a new session started on the same battery; the turn amount is logged as "1/4" for SF11
    # and only as "probe move" for SF07.
    - {animal: SF07, time: "2026-09-05 13:31:19", turns: 0.25, direction: advance, prev_session_stop: "2026-09-05 13:15:40", settle_h: 4}
    - {animal: SF11, time: "2026-09-05 15:11:34", turns: 0.25, direction: advance, prev_session_stop: "2026-09-05 15:02:10", settle_h: 4}
    # Third advances 2026-09-06 during the operator's 12:30-13:34 signal check (recording repo BATTERY_LOG 9/6 row, incident log
    # 13:45, Notion Sep 6 row): clean Stops 12:31:20 / 12:32:32, ~1 h idle, Resync on the idle loggers, guard files, restart.
    - {animal: SF07, time: "2026-09-06 13:29:42", turns: 0.25, direction: advance, prev_session_stop: "2026-09-06 12:31:20", settle_h: 4}
    - {animal: SF11, time: "2026-09-06 13:33:38", turns: 0.25, direction: advance, prev_session_stop: "2026-09-06 12:32:32", settle_h: 4}
  # Operator observations on electrode position / signal (dated; the analysis reads them as expectations for sorting:
  # a probe still above the hippocampus yields no CA1 units, emerging ripples mark the approach to the pyramidal layer).
  probe_notes:
    - {animal: SF11, time: "2026-09-05 23:50", note: "probably still ABOVE the hippocampus, or impedance bad; drive resistance very strong, unclear whether it can be advanced tomorrow", source: operator}
    - {animal: SF07, time: "2026-09-05 23:50", note: "ripples gradually strengthening (approaching the CA1 pyramidal layer); another advance planned for the 2026-09-06 morning round", source: operator}
    # 2026-09-06 LFP-signature assessment (ephys/hpc_signature_check.py + swr_strict_check.py, windows 09-04 21:30 / 09-05 00:30 / 09-05 10:30):
    - {animal: SF11, time: "2026-09-06 16:30", note: "ABOVE CA1: weakest theta of the fleet (ratio 2.5 vs 7-8), strongest slow waves in every state, only 1-6 coherent SWR-like events/min with small ripple amplitude and POSITIVE sharp waves = deep cortex (L5/L6) down to the corpus callosum/alveus, ~300-600 um above the pyramidal layer. Operator decision 09-06: keep as a cortical slow-wave / exploratory dataset (sleep staging, delta), do not expect CA1 place cells; site order within shanks still unverified (no laminar claims)", source: "analysis + operator"}
    - {animal: SF07, time: "2026-09-06 16:30", note: "just above CA1: state-locked ripple events 25-49/min at rest vs 0-4/min in theta, small amplitude, sharp waves POSITIVE on shanks 2-4 (negative on shank 1) = alveus/oriens, probably 100-200 um above the pyramidal layer; SF09/SF10/SF12 show large NEGATIVE sharp waves = inside CA1 (radiatum side)", source: analysis}
    - {animal: SF07, time: "2026-09-06 16:00", note: "the three logged 1/4-turn advances (09-04, 09-05, 09-06) produced NO detectable displacement (fingerprint r 0.95-1.00 vs the pre-turn profile for 47 h; 1 site = 50 um would give 0.85); SF11 likewise none on 09-04/09-05 - microdrives suspected slipping, drive test 2026-09-07; see results/2026c/ephys_spikes/reports/ephys_spikes_probe_move_check_2026c.md", source: analysis}
  # Logger hardware events that explain a gap or an odd session end (not probe-related). Source: the field PC incident log
  # (field2026-sync from-field/<date>_cohort3-incident-log.md) and the task Responses.
  logger_notes:
    - {animal: SF10, time: "2026-09-06 04:02:54", note: "night session 9_20260905_185709 (EVO card, not offloaded yet) stopped with a healthy cell (3.74 V flat, card 17 %, no dive, no console link); RTC writes 05:57:54/05:57:56 hit the IDLE logger, operator restarted it 05:58:13 on the same cell. Second anomalous stop in two nights (09-05 06:58 sag-and-rebound) -> loose battery contact suspected; expect a start cluster + midnight touch (00:29-00:32) and a ~3.5 h extrapolated tail", source: "incident log 2026-09-06 05:40 / 06:10, task Response 06:45"}
    - {animal: SF07, time: "2026-09-06 05:32", note: "NOT a stop: the advertisement rec counter froze at 38655 s (05:36-05:56) while voltage and card % kept updating; connect at 06:02:47 showed rec = 40529 s, continuous since 18:47:32. A frozen ad counter alone is not evidence of a stop", source: "incident log 2026-09-06 06:10"}
  # Sessions the field log marks as not-real recordings (keep them in the index, exclude from analysis). Source: recording
  # repo BATTERY_LOG_cohort3.md.
  field_flags:
    - {animal: SF10, sessions: ["10_20260905_070012.038", "11_20260905_080522.427"], flag: "zombie restarts of a dying 900 mAh cell after its 06:58 auto-stop (cell retired); high-IR sag, exclude"}
    # Probe-position TEST recordings 2026-09-06 (operator, 13:46): while SF07 and SF11 sat idle for the third advance, both loggers
    # were run on separate 64 GB test cards from a DIFFERENT PC's console to check whether the probe had reached the hippocampus.
    # Their BLE anchors carry that PC's clock, so no field-PC time exists for them (`pc_time: false` = pc_time_chain does not
    # fit them and never chains a neighbour through them). Whether they enter any analysis is UNDECIDED - keep them indexed,
    # keep them out of coverage and sorting until the operator decides.
    - {animal: SF07, sessions: ["0_20260906_123827.548", "1_20260906_123931.995"], flag: "probe-position TEST on a 64 GB test card from another PC's console during the 09-06 12:31-13:29 advance; anchors are NOT field-PC time; inclusion undecided (operator 09-06)", pc_time: false, card: test}
    - {animal: SF11, sessions: ["0_20260906_124136.884"], flag: "probe-position TEST on a 64 GB test card from another PC's console during the 09-06 12:32-13:33 advance; anchors are NOT field-PC time; inclusion undecided (operator 09-06)", pc_time: false, card: test}
  deglitch: {k_mad: 10.0, floor_adc: 500.0, window: 5}   # field-validated defaults (from-field 2026-09-01)
  probe_config: ephys/configs/probes_2026c.yaml
  preprocess_pipeline_root: "C:/Users/Cornell/Documents/GitHub/PreprocessPipeline"   # override: PREPROCESS_PIPELINE_ROOT
  # Per-cohort derived-data root on the data drive (user decision 2026-09-03; the G: artifact root dropped off the PC on
  # 09-02). ephys/ scripts write stage/, sort/, pc_time/, tools/, index/ under it and NEVER into a raw session folder.
  analysis_root: "E:/3rd_rat_spikes/analysis"

notes: >
  Night 1 (08-30 18:39 -> 08-31 ~04:30) neural data LOST on all six (FM59-62 stop-only commit; batteries pulled
  without Stop) — recovery.bin images are the only remaining trace. Daytime 08-31 ~11:00-18:00 = troubleshooting
  window (logger LFP blank, reflashes) -> analysis exclusion. Every session started before 2026-09-01 19:00
  carries glitch noise -> de-glitch first (ephys/stage_session.py does this by firmware gate). SF10: one shank
  "super noisy" (8/25 note). WISER: SF12 tag 3058 dropped 08-31 (3059 alone after); 3058 remounted on SF11
  2026-09-02 ~08:00 after 305a's battery died (SF11 gap 09-02 00:03 -> ~08:00). Probe channel->shank mapping
  UNVERIFIED (placeholder sequential blocks in ephys/configs/probes_2026c.yaml). Measured 2026-09-02: the FM62
  08-31 daytime sessions of SF8/SF9 and the 07:0x-07:2x morning-round records sit in a wide-impulse / broadband
  noise regime the single-sample de-glitch cannot fix (index columns regime + tick_removal_frac); night FM64
  sessions are the well-behaved single-sample-defect case.

raw_data_roots:
  analysis_pc:
    ephys:             "E:/3rd_rat_spikes"          # offloaded WILD sessions + recovery.bin per animal
    ephys_duplicates:  ["G:/3rd", "D:/SF10"]        # partial earlier copies (G:/3rd/SF10/.../5_20260901_054403.494 holds the field de-glitch validation)
    wiser_snapshots:   null
    reolink:           null
    thermal:           null
    weather:           null
  field_pc:
    reolink:           "E:/Reolink_record"
    thermal:           "E:/thermal_record"
    wiser_live:        null
    weather:           null
  biohpc:
    wiser_snapshots:   null
    reolink:           null
