  # ADC ("microphone") lane - switched ON on all five loggers 2026-09-10 14:40-14:56 for a body-temperature sensor (field note
  # from-field/2026-09-10_adc-lane-switch-on-and-session-splits.md; config block byte 28 = 0x08, param 625). MEASURED on SF08
  # 2026-09-10 (sessions 7_/8_/9_ vs the lane-OFF day session 6_): (1) the export gains adc.dat = int16 at 160 kHz (8 samples per
  # amplifier sample; CE_params sampling_rates[2] = 160000) - rail-to-rail garbage (mean ~8,500, sd ~13,000, hits +/-32767, 25 % of
  # power > 10 kHz): a microphone input is AC-coupled, a DC temperature voltage cannot pass it - NO temperature is recorded; (2) the
  # AMPLIFIER channels carry a full-scale pulse train while the lane is on: 312.5 Hz (= 625/2, the config parameter), ~1.2 ms wide
  # (0.4-4.4), median 28,000 ADC ~ 5.5 mV, on 64/64 channels, ~18 % of samples, onsets staggered 0-4.3 ms across channels (not
  # common-mode: median-referencing does not remove it); spike-band MAD 44 -> 250 ADC (x5.6), raw std 1,200 -> 9,500; harmonic
  # comb at 23.15 Hz multiples up to 300+ Hz. Ephys recorded with the lane ON is unusable for spikes and contaminated for LFP.
  # Sessions with the lane ON are field-flagged below (SF08 now; the other four loggers' post-14:4x day sessions and the 09-10 night
  # sessions when offloaded). The battery reading also freezes in this mode (field, 18:45).
  adc_lane:
    file: adc.dat
    dtype: int16
    rate_hz: 160000
    on_flag: "CE_params byte 28 == 0x08 (and sampling_rates[2] == 160000)"
    verdict: "no temperature recorded; amplifier polluted by a 312.5 Hz full-scale pulse train - keep OFF"
    # Lane-ON windows per logger = mic-ON config write -> mic-OFF config write (field2026-sync
    # from-field/2026-09-10_adc-lane-contamination-boundaries.csv, ble_messages times, ET). A session whose [start, end] overlaps a
    # window is contaminated even if its header says OFF (the ON block can land mid-recording: SF08 14:45:13, SF09 14:48:33,
    # SF10 14:51:32). ephys/quarantine_adc_sessions.py uses these + the header + the pulse train itself, and moves the sessions.
    on_windows:
      - {animal: SF07, on_from: "2026-09-10 14:43:45", off_at: "2026-09-10 20:43:57", note: "day 14:43:52-18:39:24, guard stubs 18:40 / 19:32, night piece 19:33:05-20:41:16"}
