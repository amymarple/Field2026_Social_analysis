- id: b.cross_day
  trunk: behavior
  lane: video
  layer: b0
  title: "Cross-day camera motion → frame corrections"
  short: Cross-day motion
  done_when: "A correction for every camera and cohort time needed (CH01-CH04 nights; CH05-CH08 all day), table rebuilt."
  status: done
  summary: >-
    Rigid-landmark tracking (the user's labels + automatic tracking) ties each cohort frame to a fixed reference frame.
    CH01-CH04: nights, hourly 21:00-04:20. CH05 / CH06 and CH07 / CH08: all day, segmented at the lid events. Table
    1496 -> 2031 rows with the CH05 / CH06 day run. A daytime CH01-CH04 lookup still returns the nearest night sample
    (CH02 09-04 12:00: 30 px off); daytime corrections only if asked.
  outputs: ["results/2026c/cv_field/reports/cv_field_frame_corrections_2026c.{csv,md} (2031 rows)", "cv/cv_field/frame_correction.py Corrections.correction / to_09_18 / to_paddock", "cv/configs/landmarks/2026c/ (labels)", "cv/configs/cohort3_lid_events.json"]
  validation: >-
    Leave-one-out held-out landmark error. Night pass = median of the first three dawn closure frames <= 3 px; samples
    <= 3 / 6 px (CH01 / 02 / 05 / 06) and <= 5 / 10 px (CH03 / 04 / 07 / 08), both rules approved by the user;
    selftests pass. CH01 98 ok / 26 failed-night rows (incl. 09-09 rain), CH02 116 / 8; CH05 day held-out median 0.5 px,
    CH06 1.5 px.
  requires: [b.cam_calib]
