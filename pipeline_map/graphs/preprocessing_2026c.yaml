  summary: >-
    DeepSqueak R1 batch gave false calls on the mics' steady 18-30 kHz tones, so whitened detectors were built. On the
    user's 260 labelled strips (36 with USV), thresholds chosen leave-one-window-out: v1 pooled 0.58 / 0.80
    (sensitivity / specificity); v2 (20th-percentile background, contour linking, > 5-s line removal) MIC01 0.76 / 0.85
    with precision 0.48, MIC02 <= 0.33. No per-mic rule adopted: precision too low. MIC01's drifting 18-21.5 kHz tone
    survives whitening. DINOv3 strip embeddings (Amendment 3, rule fixed before results): MIC01 AUC 0.88 vs v1 0.89
    (at p >= 0.5: sensitivity 0.62, specificity 0.98, precision 0.87); MIC02 fails (AUC 0.12-0.35: its 15 positive
    strips lie in 3 windows). Not clearly better than v1, so by the rule: more labels first.
