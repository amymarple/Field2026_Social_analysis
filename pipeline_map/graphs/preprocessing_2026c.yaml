# Preprocessing tree — cohort 2026c. THE ONLY PLACE THIS PROGRESS IS WRITTEN.
# pipeline_map/maps/preprocessing_2026c.{html,json} are generated by `python pipeline_map/pipeline_map.py build`.
# Schema and rules: pipeline_map/README.md. Maintained by the preprocessing-tracker agent
# (.claude/agents/preprocessing-tracker.md). Update a stage in place, set `updated`, add a `changes` entry; never delete
# a stage (a dropped route becomes status `closed` with its `reason`).

meta:
  id: preprocessing_2026c
  title: Preprocessing Tree
  subtitle: From raw recordings to the inputs research uses (cohort 2026c)
  cohort: 2026c
  as_of: 2026-10-12
  repo_url: https://github.com/amymarple/Field2026_Social_analysis
  repo_urls:
    "../Field_2026_Social_Recording/": https://github.com/amymarple/Field_2026_Social_Recording
  figure_dir: results/2026c/ephys_spikes/figures
  trunks:
    - id: ephys
      title: Ephys (WILD neurologgers)
      note: "Two branches from the raw logger data: the LFP branch (sleep states, SWR, delta, theta) and the spike branch (Kilosort → units → place cells → replay)."
      lanes:
        - {id: lfp, title: LFP branch}
        - {id: body, title: Logger body signals}
        - {id: spikes, title: Spike branch}
      layers:
        - {id: e0, title: "Raw data, QC and clocks"}
        - {id: e1, title: "Signals extracted from raw"}
        - {id: e2, title: "States and sorted spikes"}
        - {id: e3, title: "Events and curated units"}
        - {id: e4, title: "Cross-block units and theta subtypes"}
        - {id: e5, title: "Place cells → replay"}
    - id: behavior
      title: Behaviour (video, WISER, IMU, mics)
      note: "Camera geometry and the sensors (WISER, head IMU, mics) feed identity and tracking, which feed the behaviour layer (labels, syllables, head direction)."
      lanes:
        - {id: video, title: "Cameras → detection"}
        - {id: identity, title: Identity}
        - {id: sensors, title: "WISER · IMU · mics"}
      layers:
        - {id: b0, title: "Clocks and camera geometry"}
        - {id: b1, title: "Position and body sensors"}
        - {id: b2, title: "Identity and tracking"}
        - {id: b3, title: "Behaviour"}

