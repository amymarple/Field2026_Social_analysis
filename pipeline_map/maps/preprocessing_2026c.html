[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1560px;margin:0 auto;padding-inline:clamp(16px,3vw,36px);padding-block:22px 64px}
h1,h2,h3{font-family:var(--f-cond);text-wrap:balance}
h2{font-size:20px;font-weight:600;margin:0}
code{font-family:var(--f-mono);font-size:.88em}
.muted{color:var(--muted)} .small{font-size:12.5px}
button{font:inherit;color:inherit}
.btn{font:500 13px/1 var(--f-body);border:1px solid var(--line2);background:var(--surface);color:var(--ink);padding:8px 12px;border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--q);color:var(--q)}
.btn.tiny{padding:4px 7px;font-size:11.5px}
.btn:focus-visible,.node:focus-visible,.linkish:focus-visible{outline:2px solid var(--q);outline-offset:2px}
.linkish{background:none;border:0;padding:0;margin:0;cursor:pointer;color:inherit;text-align:left;font:inherit}
.linkish:hover{color:var(--q);text-decoration:underline;text-underline-offset:3px}

.top{display:flex;justify-content:space-between;gap:16px 28px;align-items:flex-end;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
.eyebrow{font:600 12px/1 var(--f-cond);text-transform:uppercase;letter-spacing:.12em;color:var(--q)}
h1{font-weight:700;font-size:clamp(28px,3.4vw,40px);line-height:1.05;margin:7px 0 6px;letter-spacing:-.01em}
.sub{margin:0;color:var(--muted);max-width:80ch}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tog{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer}
.asof{font:600 13px/1 var(--f-cond);color:var(--q);background:var(--q-bg);padding:6px 10px;border-radius:999px;letter-spacing:.04em}

.legend{display:flex;flex-wrap:wrap;gap:8px 18px;padding:12px 0 4px;font-size:12.5px;color:var(--muted);align-items:center}
.lg{display:inline-flex;gap:6px;align-items:center}
.sw{display:inline-block;width:20px;height:13px;border-radius:3px;border:1.5px solid}
.lg-e{display:inline-flex;gap:5px;align-items:center}

.pill{display:inline-flex;align-items:center;gap:4px;font:600 11.5px/1 var(--f-cond);letter-spacing:.03em;padding:3px 7px;border-radius:999px;white-space:nowrap}
.s-done{color:var(--done);background:var(--done-bg)} .s-in_progress{color:var(--prog);background:var(--prog-bg)}
.s-waiting_user{color:var(--wait);background:var(--wait-bg)} .s-blocked{color:var(--block);background:var(--block-bg)}
.s-planned{color:var(--plan);background:var(--plan-bg)} .s-not_started{color:var(--nots);background:var(--nots-bg)}
.s-closed{color:var(--closed);background:var(--closed-bg)}
.own{display:inline-block;font:500 11px/1 var(--f-mono);padding:3px 5px;border-radius:3px;background:var(--sunk);color:var(--muted);white-space:nowrap}

.summary{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:14px}
@media (max-width:1100px){.summary{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.panel h2{font-size:17px;margin-bottom:8px}
.tbar{margin:8px 0 12px}
.tbar-h{display:flex;justify-content:space-between;gap:8px;font:600 13px/1.3 var(--f-cond)}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--sunk);margin:5px 0 4px}
.bar span{display:block;height:100%}
.b-done{background:var(--done)} .b-in_progress{background:var(--prog)} .b-waiting_user{background:var(--wait)}
.b-blocked{background:var(--block)} .b-planned{background:var(--plan)} .b-not_started{background:var(--nots)} .b-closed{background:var(--closed)}
.cnts{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.lst{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;font-size:13.5px}
.lst li{display:flex;gap:8px;align-items:baseline}
.lst .k{font:600 12.5px/1.3 var(--f-cond);flex:none;min-width:0}
.owners{display:flex;flex-direction:column;gap:6px;font-size:13px}
.owners div{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}

.sec-h{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin:24px 0 10px}
.board-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.board{position:relative;display:grid;grid-template-columns:minmax(560px,1fr) minmax(560px,1fr);gap:22px;min-width:1140px}
@media (max-width:1240px){.board{grid-template-columns:minmax(560px,1fr);min-width:580px}}
svg.edges{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:3}
.trunk{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px 14px;box-shadow:var(--shadow);position:relative}
.trunk-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.trunk-h h2{font-size:19px}
.trunk-note{margin:2px 0 10px;font-size:13px;color:var(--muted)}
.grid{display:grid;gap:10px 14px;align-items:start}
.lane-h{font:600 11.5px/1.2 var(--f-cond);text-transform:uppercase;letter-spacing:.09em;color:var(--faint);padding-bottom:2px;border-bottom:1px solid var(--line)}
.layer-h{font:600 12px/1.25 var(--f-cond);color:var(--muted);padding-top:6px;writing-mode:horizontal-tb}
.layer-h b{display:block;font:600 11px/1 var(--f-mono);color:var(--q);margin-bottom:3px}
.cell{display:flex;flex-direction:column;gap:9px;min-width:0;position:relative;z-index:4}
.cell.span{flex-direction:row;flex-wrap:wrap}
.cell.span .node{flex:1 1 180px}
.rowline{grid-column:1/-1;height:0;border-top:1px dashed var(--line);margin:2px 0}
.node{border:1.5px solid var(--line2);border-radius:9px;padding:7px 9px 8px;background:var(--surface);cursor:pointer;min-width:0;position:relative;transition:opacity .15s}
.node .nt{font:600 14px/1.25 var(--f-cond)}
.node .ns{font-size:12px;line-height:1.35;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.node .nm{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:5px}
.node.st-done{background:var(--done-bg);border-color:var(--done)}
.node.st-done .nt{color:var(--done-ink)}
.node.st-in_progress{background:var(--prog-bg);border-color:var(--prog)}
.node.st-waiting_user{background:var(--wait-bg);border-color:var(--wait)}
.node.st-blocked{background:var(--block-bg);border-color:var(--block)}
.node.st-planned{background:var(--surface);border-color:var(--plan);border-style:dashed}
.node.st-not_started{background:var(--surface2);border-color:var(--nots);border-style:dotted}
.node.st-not_started .nt{color:var(--muted)}
.node.st-closed{background:var(--closed-bg);border-color:var(--closed);opacity:.75}
.node.st-closed .nt{text-decoration:line-through;text-decoration-color:var(--closed)}
.node .own{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.needs{font:700 10.5px/1 var(--f-cond);text-transform:uppercase;letter-spacing:.08em;color:var(--on-q);background:var(--wait);padding:3px 5px;border-radius:3px}
.edge{fill:none;stroke-width:1.6}
.edge.requires{stroke:var(--line2);stroke-width:1.7}
.edge.aids{stroke:var(--line2);stroke-dasharray:4 4;stroke-width:1.3}
.edge.cross{stroke:var(--cross)}
.edge.aids.hideaids{opacity:0}
.mk{fill:var(--line2)} .mk.cross{fill:var(--cross)}
.focusing .edge:not(.hl){opacity:.06}
.focusing .edge.hl{opacity:1;stroke-width:2.4}
.focusing .edge.aids.hl{opacity:.9}
.focusing .node:not(.lit){opacity:.32}
.flash{animation:flash 1.4s ease-out 1}
@keyframes flash{0%{box-shadow:0 0 0 4px var(--q)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion: reduce){.node{transition:none}.flash{animation:none;outline:2px solid var(--q)}}

.upd{display:flex;flex-direction:column;gap:10px}
.upd article{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13.5px}
details > summary{cursor:pointer}
.idx-sum{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;list-style:none}
.idx-sum::-webkit-details-marker{display:none}
.idx-sum::before{content:"\25B8";color:var(--q)}
details[open] > .idx-sum::before{content:"\25BE"}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0 8px}
.filters select,.filters input{font:inherit;font-size:13.5px;padding:6px 8px;border:1px solid var(--line2);border-radius:6px;background:var(--surface);color:var(--ink)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table.idx{border-collapse:collapse;width:100%;font-size:13px}
.idx th,.idx td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.idx th{font:600 11.5px/1.2 var(--f-cond);text-transform:uppercase;letter-spacing:.07em;color:var(--faint);background:var(--surface)}
.idx tbody tr{cursor:pointer}
.idx tbody tr:hover{background:var(--surface2)}
.foot{margin-top:28px;font-size:12.5px;color:var(--faint);border-top:1px solid var(--line);padding-top:12px}

.scrim{position:fixed;inset:0;background:rgba(8,12,18,.3);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(500px,100vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:-12px 0 30px rgba(0,0,0,.14);z-index:21;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 20px calc(26px + env(safe-area-inset-bottom,0px))}
.dw-top{display:flex;gap:10px;align-items:center}
.dw-top .grow{flex:1}
.tchip{font:600 11px/1 var(--f-cond);text-transform:uppercase;letter-spacing:.1em;color:var(--q)}
.nid{color:var(--muted)}
.dw-t{font-size:21px;line-height:1.25;margin:10px 0 8px}
.dw-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dsec{margin-top:14px}
.h3{font:600 12px/1 var(--f-cond);text-transform:uppercase;letter-spacing:.09em;color:var(--faint);margin:0 0 5px}
.dsec p{margin:0;font-size:14px}
.dsec ul{margin:0;padding-left:18px;font-size:13.5px;display:flex;flex-direction:column;gap:3px}
.callout{border-radius:8px;padding:9px 11px;font-size:13.5px;margin-top:12px}
.callout b{display:block;font:600 11.5px/1 var(--f-cond);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.c-wait{background:var(--wait-bg)} .c-wait b{color:var(--wait)}
.c-block{background:var(--block-bg)} .c-block b{color:var(--block)}
.c-next{background:var(--prog-bg)} .c-next b{color:var(--prog)}
.c-closed{background:var(--closed-bg)} .c-closed b{color:var(--closed)}
.srcl{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;font-size:13px}
.srcl code{word-break:break-all}
.srcl .anchor{color:var(--muted);font-size:12.5px;margin-top:2px}
.srcl a{color:var(--q)}
.rel li{list-style:none}
.rel{padding:0;margin:0;display:flex;flex-direction:column;gap:4px;font-size:13px}
.dfig{margin:0 0 10px}
.dfig img{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff}
.dfig figcaption{font-size:12.5px;color:var(--muted);margin-top:3px}
</style>

cificity); v2 (20th-percentile background, contour linking, > 5-s line removal) MIC01 0.76 / 0.85 with precision 0.48, MIC02 <= 0.33. No per-mic rule adopted: precision too low. MIC01's drifting 18-21.5 kHz tone survives whitening. DINOv3 strip embeddings (Amendment 3, rule fixed before results): MIC01 AUC 0.88 vs v1 0.89 (at p >= 0.5: sensitivity 0.62, specificity 0.98, precision 0.87); MIC02 fails (AUC 0.12-0.35: its 15 positive strips lie in 3 windows). Not clearly better than v1, so by the rule: more labels first.","waiting_on_user":"A second labelling round (proposed by the Mic session): about 24 new 5-min windows, 12 per mic, spread over 08-31 -> 09-10, night-weighted, presence only.","next":"After the new labels: re-evaluate v1 / v2 / DINOv3 per mic; then a full run only for a mic that passes.","outputs":["ephys/usv/ (ds_batch.m, usv_whiten_detect.py, usv_detect_v2.py, usv_eval_v2.py)","ephys/configs/usv_review_2026c/usv_strip_labels.csv","D:/Field2026_analysis_out/2026c/usv_v2_sample/","D:/Field2026_analysis_out/2026c/usv_dino_presence/"],"requires":["b.audio"],"owner":["Mic"],"updated":"2026-10-11","changes":[{"date":"2026-10-11","what":"blocked -> waiting_user: the Mic session is back; v2 detector and the DINOv3 strip classifier (Amendment 3) both not clearly better than v1 -> a second labelling round (commit 0e64f98)."}],"sources":[{"path":"implementation_plan/2026-10-08-mic-imu-sync.md","l0":170,"l1":170,"anchor":"Amendment 2"},{"path":"implementation_plan/2026-10-08-mic-imu-sync.md","l0":203,"l1":203,"anchor":"precision 0.48"},{"path":"implementation_plan/2026-10-08-mic-imu-sync.md","l0":213,"l1":213,"anchor":"Amendment 3"},{"path":"implementation_plan/2026-10-08-mic-imu-sync.md","l0":234,"l1":234,"anchor":"Amendment 3"},{"path":"implementation_plan/2026-10-08-mic-imu-sync.md","l0":247,"l1":247,"anchor":"more labels first"},{"path":"ephys/usv/usv_whiten_detect.py","l0":1,"l1":4,"anchor":"USV candidates after removing the mics' steady background"}]},{"id
